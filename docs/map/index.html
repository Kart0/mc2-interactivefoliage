<title>MC2 Foliage Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night canopy. The constellation fills the stage, a reading panel sits to its right (below it on phones);
   version and loader filters ride in the top bar like a field guide's tabs. Deliberately one dark look. */
:root {
  --ground: #0d1613;
  --ground-2: #121e1a;
  --panel: #16231f;
  --line: #26372f;
  --fg: #e3ebdd;
  --muted: #94a89c;
  --faint: #5f7268;
  --pollen: #e8c36a;
  --warn: #f09a72;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --g-core: #7fd49a; --g-split: #b7d46c; --g-motion: #8ecae9; --g-shaders: #b8a4f0; --g-terrain: #d9a97a;
  --g-sodium: #8fe0cc; --g-iris: #f0a2c9; --g-polytone: #f2d27a; --g-loader: #aeb8ff; --g-build: #a4ada8;
  --g-external: #e6ddcb; --g-version: #e8c36a; --g-snowrealmagic: #a9dcff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--fg); font: 15px/1.5 var(--body); }
.app { display: flex; flex-direction: column; height: 100%; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px 12px;
  border-bottom: 1px solid var(--line); background: var(--ground-2); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1.1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs { margin-left: auto; }
button { font: inherit; color: inherit; }
.tab, .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px;
  cursor: pointer; font-size: 13px; color: var(--muted); }
.tab[aria-pressed="true"], .chip[aria-pressed="true"] { color: var(--ground); background: var(--pollen); border-color: var(--pollen); }
.tab:focus-visible, .chip:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--pollen); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.filters label.cap { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.fgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#search { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 5px 10px;
  width: 220px; max-width: 100%; font: 13px var(--body); }

main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; }
.legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 28px);
  font-size: 12px; color: var(--muted); pointer-events: auto; }
.legend button { background: none; border: 0; padding: 2px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend button[aria-pressed="false"] { opacity: 0.35; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }

aside { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 22px 28px; }
aside h2 { margin: 0 0 4px; font: 700 21px/1.2 var(--display); text-wrap: balance; }
aside h3 { margin: 22px 0 8px; font: 600 11px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
aside p { margin: 0 0 10px; }
aside ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.tag { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--ground); border: 1px solid var(--line); color: var(--muted); }
.tag.group { color: var(--ground); border: 0; }
.pitfalls li { color: var(--warn); }
.pitfalls li span { color: var(--fg); }
.files { list-style: none; padding: 0 !important; }
.files li { display: flex; justify-content: space-between; gap: 10px; font: 12px/1.4 var(--mono); border-bottom: 1px dashed var(--line); padding: 4px 0; }
.files li code { overflow-wrap: anywhere; min-width: 0; }
.files li em { font-style: normal; color: var(--faint); white-space: nowrap; }
.links { list-style: none; padding: 0 !important; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--fg); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.links li { font-size: 14px; }
.links li small { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stats b { display: block; font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }

.view { flex: 1; overflow: auto; padding: 22px 20px 40px; min-width: 0; }
.view h2 { font: 700 22px var(--display); margin: 0 0 6px; }
.view > p { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; min-width: 980px; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
thead th { font: 700 15px var(--display); background: var(--ground-2); position: sticky; top: 0; }
thead th.sel { color: var(--pollen); }
tbody th { font-weight: 600; color: var(--muted); width: 150px; background: var(--ground-2); }
td.sel { background: rgba(232, 195, 106, 0.06); }
td .ld { display: block; }
td .ld b { font: 500 11px var(--mono); color: var(--faint); margin-right: 4px; }
ol.recipe { max-width: 75ch; display: grid; gap: 12px; padding-left: 22px; }
ol.recipe li::marker { font: 700 15px var(--display); color: var(--pollen); }
.rules { max-width: 75ch; display: grid; gap: 8px; padding-left: 18px; color: var(--muted); }

svg text { font-family: var(--body); pointer-events: none; }
@media (max-width: 860px) {
  main { flex-direction: column; }
  .stage { flex: none; height: 62vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); flex: none; }
  .tabs { margin-left: 0; }
  header, .filters { padding-inline: 16px; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="brand"><h1>MC2 Foliage Atlas</h1><span id="subtitle">every piece, every version</span></div>
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" id="tab-map" aria-pressed="true">Constellation</button>
      <button class="tab" id="tab-matrix" aria-pressed="false">Versions</button>
      <button class="tab" id="tab-recipe" aria-pressed="false">Port recipe</button>
    </div>
  </header>
  <div class="filters">
    <div class="fgroup"><label class="cap">Version</label><div class="chips" id="versions"></div></div>
    <div class="fgroup"><label class="cap">Loader</label><div class="chips" id="loaders"></div></div>
    <div class="fgroup"><label class="cap" for="search">Find</label><input id="search" type="search" placeholder="Sodium, setSectionMesh, sway.glsl…" autocomplete="off"></div>
  </div>
  <main id="main-map">
    <div class="stage"><svg id="graph" role="img" aria-label="Constellation of the mod's pieces"></svg><div class="legend" id="legend"></div></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
  <main id="main-matrix" hidden><div class="view" id="matrix"></div></main>
  <main id="main-recipe" hidden><div class="view" id="recipe"></div></main>
</div>

<script>
const DATA = {"meta": {"title": "MC2 Foliage Atlas", "about": "How MC2 Interactive Foliage works on every Minecraft version and loader it supports: its pieces, what each one hooks into, and every compatibility layer. Hand-written facts live in docs/map/curated.json; docs/map/generate.py checks them against the source tree, adds what it can read from the code, and writes foliage-map.json, index.html and docs/VERSION-MAP.md from them. Edit curated.json, never the generated files.", "versions": ["1.20.1", "1.21.1", "1.21.11", "26.1.2", "26.2", "26.3"], "loadersByVersion": {"1.20.1": ["fabric", "forge"], "1.21.1": ["fabric", "neoforge"], "1.21.11": ["fabric", "neoforge"], "26.1.2": ["fabric", "neoforge"], "26.2": ["fabric", "neoforge"], "26.3": ["fabric", "neoforge"]}, "rangeSyntax": "A node's 'versions' is a list of Stonecutter-style bounds that must all hold, e.g. \">=1.21.11 <26.3\"; empty means every version. 'loaders' limits it to those loaders; absent means all."}, "groups": [{"id": "core", "label": "GPU renderer", "about": "Meshes the foliage near the player on its own and draws it with the sway on the GPU."}, {"id": "split", "label": "Mesh split & handover", "about": "Takes the near foliage out of the chunk mesh, and hands it back and forth without a frame of double or missing plants."}, {"id": "motion", "label": "Motion", "about": "What moves the plants: Sway's pushes, the calm sway, the rain wind and its shelter."}, {"id": "shaders", "label": "Shaders", "about": "The mod's own shader sets, one per generation of Minecraft's shading language, all sharing sway.glsl."}, {"id": "terrain", "label": "Terrain look", "about": "Drawing the foliage with the shaders the chunks are drawn with, so it matches vanilla, Sodium and resource packs."}, {"id": "sodium", "label": "Sodium & kin", "about": "Sodium, Embeddium and Indium: who meshes and draws the chunks when they are installed."}, {"id": "iris", "label": "Shader packs", "about": "Iris and Oculus: the foliage drawn through a shader pack's own programs, swaying, into its shadow map too."}, {"id": "polytone", "label": "Polytone", "about": "The foliage in Polytone's shadow map."}, {"id": "vulkanmod", "label": "VulkanMod", "about": "The foliage drawn through VulkanMod, which meshes and draws the chunks itself on Vulkan."}, {"id": "sable", "label": "Sable", "about": "The foliage of Sable's sub-levels -- a felled tree, a ship -- drawn, shaded and pushed where the sub-level is."}, {"id": "snowrealmagic", "label": "Snow! Real Magic", "about": "Plants held inside Snow! Real Magic's snow: pushed by Sway, bent, drawn snowy on the CPU and the GPU, shaking snow off when touched."}, {"id": "loader", "label": "Loaders", "about": "Where the mod meets Fabric, NeoForge and Forge."}, {"id": "build", "label": "Build & dev", "about": "Stonecutter, build-logic, access wideners, mixin configs and the dev-run traps."}, {"id": "external", "label": "Other mods", "about": "Mods the renderer depends on or works with."}, {"id": "version", "label": "Versions", "about": "The Minecraft versions the mod is built for."}], "nodes": [{"id": "renderer", "label": "GpuFoliageRenderer", "group": "core", "kind": "component", "files": ["gpu/GpuFoliageRenderer.java"], "summary": "The GPU renderer. Meshes every section near the player that holds foliage, packs sections into 8x4x8 regions (Sodium's grouping) and draws each region's visible runs in as few calls as it can.", "details": ["Geometry comes from ModelBlockRenderer.tesselateBlock, the method the section compiler uses, so AO, light and biome tint are vanilla's.", "Each vertex carries two extra values after the block format: SwayCell (which plant, for its push) and SwayWeights (one float, 24 exact bits: the wind weight 10, the push 8, a still-in-calm flag 1, a steady flag 1, the wind exposure 4 -- for a block hanging on leaves, three of those and one bit for whether the leaves wave at its corner; packWeights, unpacked in sway.glsl and both legacy vsh).", "Rebuilds have a budget per frame on every version, in time: the queued sections nearest the camera for a quarter of the frame before (frameBudgetNanos, 4 to 16 ms), and region uploads for half of that after the first. Counted in frames alone, a change took as many frames at any frame rate, so three times as long at 30 a second as at 90. The near area's radius follows the render distance.", "Sections already on screen whose light or blocks changed are urgent (URGENT, queueUrgent from onLightChanged and onBlockChanged): rebuilt before anything else, for twice the frame's budget (8 to 24 ms a frame), and their regions uploaded as soon as none of their urgent sections is left. All of them on the frame they are queued, up to 50 ms, was one frame for a torch on 1.21.1, where a section meshed in a millisecond, and a stutter on 26.3, where forty sections took 70 to 200 ms. A light that changes a section again within LIGHT_STREAM_MILLIS (3 s) is a light on the move -- LambDynamicLights asks for the sections around a carried light through the same setSectionDirty -- and is not urgent past the first time.", "Queued sections are rebuilt in view first (buildNearest, inView: the camera's frustum, and what Sodium sees where it draws the chunks), nearest first; what is out of view only with what the frame has left. A light carried through a forest asks for every section around the player every tick, half of them behind: at 30 frames a second on NeoForge 1.21.1, where a section took 3.4 ms, the queue passed a thousand sections and the light fell seconds behind the ground until the ones being looked at went first.", "A section that comes out the size it is on screen -- its light changed and nothing else -- is written over its own stretch of the region's buffer (putSection, Region.patch) rather than the region uploaded whole: 0.02 ms against 8.5 ms a region, measured there. Before 1.21.11 the vertex buffer's own buffer is found through the array it binds.", "The bursts go to the ordinary log, not the debug one, while a file named mc2-foliage-timing stands in the game's folder: NeoForge keeps no debug log for a mod, and it is what to ask of someone reporting late light.", "Out of view, at most one section a frame is rebuilt: a carried light asks for the ones behind the player again every tick, 30% of all the rebuilds measured. A region whose urgent section changed size -- a block placed or broken -- is uploaded on the frame the section is rebuilt (uploadUrgentRegions), not once the rest of the region's urgent sections are done: a torch set down on a bush left the bush on screen inside the torch for half a second. Of the meshing, measured on NeoForge 1.21.1 in a dense forest at 3.8 ms a section, 88% is vanilla's own tesselation (faces, light, ambient occlusion), 11% the vertices' sway weights and 1% setting each block up: reusing the weights when only the light changed is not worth it, and what is left is meshing off the render thread, as vanilla does. Measured on 1.21.1 at 30 frames a second, a torch -- some thirty sections -- reached the foliage in 1 frame, against 2 to 5 within the frame's budget and 12 to 27 with the old one; holding the foliage back until the chunk mesh of the section swapped in was worse than any, as half the sections, out of view, never did. Each burst is timed in the debug log (measureBurst).", "Only near the player: further out the chunk mesh keeps the foliage, still.", "At most one region is uploaded a frame, on every version (uploadDueRegion): the nearest to the camera among those with nothing left queued for them or waiting past 500 ms; one waiting past 2 s goes first. A region is drawn as last uploaded meanwhile (Region.uploadedSections), so its buffer and its layout always agree. Uploading every dirty region whole each frame, as 1.21.11+ did, was the stutter waving leaves showed.", "A section holds its cutout vertices and then its solid ones (Section.opaqueVertexCount: leaves drawn as the game's Fast leaves are, meshed in a second walk); a region's buffer holds every section's cutout part and then every solid part, so each kind still goes out in long runs, and the solid runs are drawn first with a pipeline that keeps every pixel.", "Three draw paths by version: drawLegacy (<1.21.11), a pass of its own (1.21.11-26.2), prepare/draw split into vanilla's pass (26.3+)."], "pitfalls": ["It is one 4200-line file guarded per version; read the branch for the version you work on, not the first one you find."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 5424, "guard": "//? >=1.20.1 {"}}}, {"id": "draw-legacy", "label": "Legacy draw", "group": "core", "kind": "path", "versions": ["<1.21.11"], "files": ["gpu/GpuFoliageRenderer.java"], "summary": "Before 1.21.11: a ShaderInstance loaded from JSON and VertexBuffers per region, drawn right away from the loader's render event.", "details": ["Two kinds a frame (drawLegacy, drawLegacyRuns): the leaves drawn solid first, with RenderType.solid's state and a shader that keeps every pixel, then the rest with RenderType.cutout's.", "Shader registered through CoreShaderRegistrationCallback (Fabric) or RegisterShadersEvent (NeoForge/Forge).", "The frame hook hands over camera, frustum, model view and projection (legacy draw(Vec3, Frustum, Matrix4f, Matrix4f))."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 5424, "guard": "//? >=1.20.1 {"}}}, {"id": "draw-pass", "label": "Own render pass", "group": "core", "kind": "path", "versions": [">=1.21.11", "<26.3"], "files": ["gpu/GpuFoliageRenderer.java"], "summary": "1.21.11 to 26.2: RenderPipelines, compiled by the game, drawn in a render pass the mod opens itself right after the opaque terrain.", "details": ["draw(LevelRenderState) from the loader's opaque-terrain event; submitDraws writes the region transforms and draws.", "From 26.2 depth is reversed, and uniforms are bind group layouts."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 5424, "guard": "//? >=1.20.1 {"}}}, {"id": "draw-split", "label": "Prepare / draw split", "group": "core", "kind": "path", "versions": [">=26.3"], "files": ["gpu/GpuFoliageRenderer.java", "mixin/LevelPassMixin.java"], "summary": "26.3+: the opaque world is drawn inside one pass vanilla opens (Main/Solid), where nothing may be written. So the frame is prepared as the level's extraction ends, the view is written at LevelRenderer.render HEAD, and only bind+draw happens inside vanilla's pass.", "details": ["Prepare: draw(LevelRenderState) at Fabric END_EXTRACTION / NeoForge ExtractLevelRenderStateEvent: collects draws, compiles pipelines, writes sway/push buffers, requests the shared index count.", "writeLevelUniforms at LevelRenderer.render HEAD: region transforms or the terrain's block, with the final view (Iris moves bobbing into it just before).", "drawIntoLevelPass from LevelPassMixin in executeSolid, before the solid features.", "closeBuffers discards what was prepared: a pack switch reloads everything between prepare and draw."], "pitfalls": ["With a pass open, createRenderPass, writeToBuffer, copies and clears throw; mapped DynamicGpuData writes are fine.", "Never ask for a compiled pipeline inside the pass: PipelineCache.get compiles on demand, and does not remember failures (compiledPipeline remembers them per shader reload).", "Every uniform a pipeline declares must be bound before a draw, or setupDraw dies on a null buffer.", "The shared index buffer may only grow outside a pass: requestIndexCount while preparing, getBuffer() in the pass.", "Do not use DynamicGpuData.writeChunkSections: it shares storage with the MDI vertex buffer. Each region keeps its own ChunkSection UBO."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 5424, "guard": "//? >=1.20.1 {"}, "mixin/LevelPassMixin.java": {"kind": "java", "lines": 50, "guard": "//? >=26.3 {"}}}, {"id": "near-area", "label": "Near area & regions", "group": "core", "kind": "component", "files": ["gpu/GpuFoliageRenderer.java"], "summary": "Which sections the GPU owns: within an adaptive radius of the player, rebuilt nearest first. Regions out of range are freed before anything is drawn.", "details": ["Chunk load/unload come from the loader's chunk events (Sodium overwrites vanilla's dirty-marking routes).", "Light changes and allChanged come through LevelExtractorMixin; block changes through ClientLevelMixin."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 5424, "guard": "//? >=1.20.1 {"}}}, {"id": "split", "label": "GpuFoliageSplit", "group": "split", "kind": "component", "files": ["gpu/GpuFoliageSplit.java"], "summary": "Decides who draws each plant. Every foliage model is wrapped by a loader-specific model; while a chunk mesher asks it for a block near the player (leaveToGpu), it hands back nothing.", "details": ["A block is foliage when Sway says it is interactive (SwayAPI.isInteractive).", "Meshers hand the model the position: Fabric's rendering API, NeoForge's model extensions, Forge's model data. Vanilla, Sodium 0.6+ and Embeddium all go through them.", "Sodium's LevelSlice (WorldSlice before 0.6) is how a Sodium build is recognised."], "fileInfo": {"gpu/GpuFoliageSplit.java": {"kind": "java", "lines": 706, "guard": "//? >=1.20.1 {"}}}, {"id": "model-fabric", "label": "GpuFoliageModel (FRAPI)", "group": "split", "kind": "hook", "loaders": ["fabric"], "files": ["gpu/GpuFoliageModel.java", "platform/fabric/FabricFoliageHooks.java"], "summary": "Fabric: wraps foliage models with ModelLoadingPlugin, outside Sway's wrapper, and withholds quads in emitQuads.", "details": ["modifyModelAfterBake before 1.21.11 (block read from the model id), modifyBlockModelAfterBake from 1.21.11 (the state is handed over)."], "fileInfo": {"gpu/GpuFoliageModel.java": {"kind": "java", "lines": 93, "guard": "//? fabric {"}, "platform/fabric/FabricFoliageHooks.java": {"kind": "java", "lines": 120, "guard": "//? fabric {"}}}, {"id": "model-neoforge", "label": "NeoforgeFoliageModel", "group": "split", "kind": "hook", "loaders": ["neoforge"], "files": ["platform/neoforge/NeoforgeFoliageModel.java", "platform/neoforge/NeoforgeFoliageHooks.java"], "summary": "NeoForge: wraps inside Sway's wrapper at ModelEvent.ModifyBakingResult. 1.21.1: BakedModelWrapper deciding in getModelData. 1.21.11+: answers the collectParts(level, pos, state, random, parts) extension.", "details": ["Sodium on NeoForge asks through collectParts too (NeoForgeModelAccess.collectPartsOf) with its LevelSlice."], "fileInfo": {"platform/neoforge/NeoforgeFoliageModel.java": {"kind": "java", "lines": 217, "guard": "//? neoforge && >=1.21.1 {"}, "platform/neoforge/NeoforgeFoliageHooks.java": {"kind": "java", "lines": 258, "guard": "//? neoforge && >=1.21.1 {"}}}, {"id": "model-forge", "label": "ForgeFoliageModel", "group": "split", "kind": "hook", "loaders": ["forge"], "versions": ["<1.21.1"], "files": ["platform/forge/ForgeFoliageModel.java", "platform/forge/ForgeFoliageHooks.java"], "summary": "Forge 1.20.1: decides in getModelData (vanilla and Embeddium call it for every block) and carries the answer in model data to getQuads. Sits outside Sway's wrapper.", "details": ["Embeddium hands getModelData a generated WorldSliceLocal, not WorldSlice."], "fileInfo": {"platform/forge/ForgeFoliageModel.java": {"kind": "java", "lines": 115, "guard": "//? forge {"}, "platform/forge/ForgeFoliageHooks.java": {"kind": "java", "lines": 186, "guard": "//? forge {"}}}, {"id": "handover", "label": "Mesh swap handover", "group": "split", "kind": "hook", "files": ["mixin/SectionMeshSwapMixin.java", "gpu/GpuFoliageSplit.java"], "summary": "The GPU takes or gives back a section only once the chunk mesh that matches it is on screen, so plants never vanish or double for a frame.", "details": ["Vanilla: LevelRenderer.addRecentlyCompiledChunk (1.20.1), RenderSection.setCompiled (1.21.1), setSectionMesh (1.21.11+).", "Empty builds finish on a worker thread (before 1.21.11 and from 26.1.2): reported through onChunkMeshSwappedElsewhere.", "Sodium: see Sodium upload hook.", "A whitelist group switched on (the leaves): in a section the renderer already draws, the chunk mesh keeps the group's blocks (GpuFoliageSplit.AWAITING_GROUP, read by isFoliageAt) until the renderer has uploaded a mesh built with the new list (Section.listGeneration), and is only then asked to let go. The leaves are drawn twice for the few frames that chunk build takes: accepted, rather than drawn by nobody for as long as the renderer takes to mesh and upload every section. Switched off, the chunk mesh goes first and the renderer follows on the MeshSwap."], "fileInfo": {"mixin/SectionMeshSwapMixin.java": {"kind": "java", "lines": 84, "guard": "//? >=1.20.1 {"}, "gpu/GpuFoliageSplit.java": {"kind": "java", "lines": 706, "guard": "//? >=1.20.1 {"}}}, {"id": "dirty", "label": "Change tracking", "group": "split", "kind": "hook", "files": ["mixin/ClientLevelMixin.java", "mixin/LevelExtractorMixin.java"], "summary": "Keeps the mod's meshes in step: block changes (ClientLevel.setBlocksDirty), light changes (setSectionDirty), and allChanged (resource reload, world swap, video options).", "details": ["The class that marks sections dirty is LevelRenderer before 26.2 and LevelExtractor from 26.2.", "The private setSectionDirty(IIIZ) every route ends in is followed too (onSectionAsked, queued in its turn, require = 0): LambDynamicLights needs no compatibility layer -- its light comes through vanilla's own brightness getter, which the mesher reads -- but before 26.2 (4.8 on 1.21.1) it asks for the sections around a carried light through an accessor to that private method, never the public one, so the foliage kept the dynamic light of wherever it was last meshed. From 26.2 (4.13) it calls the public one. Tested with it on 26.3 and 1.21.1 Fabric.", "1.21.11-26.1: also catches the cull frustum at prepareCullFrustum (from 26.1.2 the camera state carries it)."], "fileInfo": {"mixin/ClientLevelMixin.java": {"kind": "java", "lines": 36, "guard": "//? >=1.20.1 {"}, "mixin/LevelExtractorMixin.java": {"kind": "java", "lines": 74, "guard": "//? >=1.20.1 {"}}}, {"id": "sway-api", "label": "Sway", "group": "external", "kind": "mod", "summary": "Required. Decides which blocks are interactive, how they are pushed (BehaviorPipeline, contributors), and deforms them itself in CPU mode.", "details": ["Modrinth ids per version are in stonecutter.properties.toml (deps.sway).", "Fabric: deforms in FRAPI emitBlockQuads. NeoForge/Forge: deforms in the model, the mod's wrapper sits inside it (NeoForge) or outside it (Forge)."], "pitfalls": ["Never modify Sway and do not contact its author (user's rule)."], "fileInfo": {}}, {"id": "interaction", "label": "GpuFoliageInteraction", "group": "motion", "kind": "component", "files": ["gpu/GpuFoliageInteraction.java"], "summary": "Sway's push for each plant, followed through a damped spring and sent to the shader as a uniform block (up to 128 cells), keyed by the plant's anchor block.", "details": ["upload() also steps the springs: call it once per frame. A second draw in the same frame (shadow map) reuses uploaded().", "Before 1.21.11 the block is tied to its binding point (12) on the program in use at every draw, not only as the shader loads: Veil, which Sable brings, builds a vanilla shader's program anew as it is applied, and a new program reads every uniform block from binding 0, so the plants swayed and nothing pushed them. Tested with Sable 2.0.6 on 1.21.1."], "fileInfo": {"gpu/GpuFoliageInteraction.java": {"kind": "java", "lines": 484, "guard": "//? >=1.20.1 {"}}}, {"id": "proximity", "label": "SwayProximityForceMixin", "group": "motion", "kind": "hook", "files": ["mixin/SwayProximityForceMixin.java"], "summary": "While the GPU draws, entities push plants from a little further and a little harder than Sway alone, only as Sway reads it.", "fileInfo": {"mixin/SwayProximityForceMixin.java": {"kind": "java", "lines": 40, "guard": "//? >=1.20.1 {"}}}, {"id": "wind", "label": "Rain wind & shelter", "group": "motion", "kind": "component", "files": ["gpu/WindShelter.java"], "summary": "Rain replaces the calm sway with a west wind with gusts (sway.glsl). WindShelter bakes each plant's exposure (roofs, upwind walls) into 4 bits of SwayWeights while meshing.", "details": ["Weather reaches the shader in the FoliageSway block (>=1.21.11) or as a loose uniform (legacy).", "Tuning constants live in sway.glsl (MC2_WIND_LEAN etc.)."], "fileInfo": {"gpu/WindShelter.java": {"kind": "java", "lines": 412, "guard": "//? >=1.20.1 {"}}}, {"id": "settings", "label": "Settings & screen", "group": "motion", "kind": "component", "files": ["FoliageSettings.java", "FoliageConfigScreen.java", "platform/fabric/FabricModMenuIntegration.java", "platform/fabric/FoliageKeyBindings.java", "platform/neoforge/NeoforgeKeyBindings.java", "platform/forge/ForgeKeyBindings.java"], "summary": "The mod's own config file next to Sway's, the two-column screen with presets, renderer (CPU/GPU), waving, weather wind and distance.", "pitfalls": ["User-facing text goes through translation keys (the user translates). Update widgets in place, never rebuild the screen."], "fileInfo": {"FoliageSettings.java": {"kind": "java", "lines": 333, "guard": ""}, "FoliageConfigScreen.java": {"kind": "java", "lines": 754, "guard": "//? >=1.20.1 {"}, "platform/fabric/FabricModMenuIntegration.java": {"kind": "java", "lines": 28, "guard": "//? fabric {"}, "platform/fabric/FoliageKeyBindings.java": {"kind": "java", "lines": 89, "guard": "//? fabric {"}, "platform/neoforge/NeoforgeKeyBindings.java": {"kind": "java", "lines": 94, "guard": "//? neoforge {"}, "platform/forge/ForgeKeyBindings.java": {"kind": "java", "lines": 63, "guard": "//? forge {"}}}, {"id": "modcompat", "label": "ModCompatRegistry", "group": "motion", "kind": "component", "files": ["ModCompatRegistry.java"], "summary": "Registers third-party mods' plants with Sway (by id, skipped when the mod is absent), which also makes them GPU foliage.", "details": ["Plants of newer versions a backport mod adds to an older one under vanilla's own ids (VanillaBackport: bush, firefly bush, dry grasses, eyeblossoms, cactus flower, pale oak sapling) are registered by id too, where Sway does not know them already (registerPlantIfNew): Sway only knows the plants of the version it is built for. No mod is named.", "Before 1.21.4 a model cannot say a part of it glows, so VanillaBackport wraps the block's model and draws a second one over it at full light through Fabric's rendering API alone. The mesher goes through vanilla's path and only saw the first: on Fabric before 1.21.11 it finds that second model by the wrapper's shape (a field called emissiveModel, GpuFoliageRenderer.emissiveLayerOf) and meshes it too, every vertex at full light (FoliageVertexWriter.fullBright), its animated texture marked for Sodium. Tested on 1.21.1 Fabric."], "pitfalls": ["Fabric starts mods in no promised order, and Kiwi registers Snow! Real Magic's blocks as it starts: in a run where that came after this mod the snow was never handed to Sway, and plants in it were not pushed -- some runs, not others (69 blocks registered in the log rather than 74). registerLate looks for them again as the models load (a ModelLoadingPlugin in FabricFoliageHooks), once every mod has started."], "fileInfo": {"ModCompatRegistry.java": {"kind": "java", "lines": 444, "guard": ""}}}, {"id": "sway-removals", "label": "SwayRemovals", "group": "motion", "kind": "component", "files": ["SwayRemovals.java"], "summary": "Provisional: blocks Sway registers that it should not (moss carpet, glow lichen, spore blossom, chorus, big dripleaf), taken back out through Sway's public API (getRegistry().remove + an empty pipeline) right after ModCompatRegistry, before models bake. They stay plain vanilla in both renderers, so the GPU leaves them to the chunk. Goes once a Sway release drops them.", "details": ["Replaced the waving blacklist, whose blocks were all of this kind. SwayWeights' still flag stays, now set only for blocks that follow the leaves."], "fileInfo": {"SwayRemovals.java": {"kind": "java", "lines": 82, "guard": "//? >=1.21.11 {"}}}, {"id": "waving-whitelist", "label": "WavingWhitelist", "group": "motion", "kind": "component", "files": ["WavingWhitelist.java"], "summary": "Blocks Sway does not bend that the GPU renderer still draws and waves, by group (vanilla and mods together): GENERAL (petals, wildflowers; always on, 2x a plant) and LEAVES (#minecraft:leaves; 0.20, waved as a field so touching leaves never part; the player's Waving Leaves checkbox). A follow-the-leaves list (vines) waves with the leaves only while they wave.", "details": ["Tags are read at bake time from every jar's data/<ns>/tags/block files (Platform.readAll; NeoForge 26.3 through ModList), since the world's tags arrive after the models are baked.", "GpuFoliageSplit.mayWave wraps listed blocks at bake whatever their group's state; waves/isFoliage decide at mesh time, so the checkbox only rebuilds the GPU area's sections (GpuFoliageRenderer.foliageListChanged, remesh on the MeshSwap).", "Field wave: constant weight, edge and rain fade measured at the vertex (SwayWeights' steady flag, which also keeps pushes from calming the sway). Rain's reach is worked out per corner (WindShelter.cornerExposure: the 8 blocks around it, leaves neither walls nor roofs to one another, no sky light), the same for every block sharing the corner, so sheltered leaves calm without cracks.", "A field's corner touching a block that holds the leaves still does not wave (SwayAnchor.pinAt, from the 8 blocks around the corner alone, so every block sharing it agrees; every version, Fancy and Fast): a full block that is not leaves -- a trunk, the ground -- or a layer of the resting kind lying on anything but a leaf (holdsLeavesStill). Leaves never sink into a trunk nor part from it. Since every corner of a face against such a block stands still, leaves touching only air, leaves and such blocks are meshed with the culling renderer, exactly as the section compiler culls; only against a block they part from (a fence, stairs, a slab) is every face kept (partsFromNeighbour; a second ModelBlockRenderer built with cull off).", "Followers (vines), block by block (SwayAnchor.hangVine), no vote: a block with leaves behind it moves exactly as they do (still+steady flags; the leaves' weight is the shaders' MC2_LEAVES_WAVE constant, which must match Group.LEAVES; three exposure bits carry the corner's wind reach and the fourth whether the leaves wave at that corner or are held still, SwayAnchor.leafHeldAt), one with anything else solid behind it stands still, and neither is pushed. Below the lowest block with something behind it the strand hangs free, straight as a strip of cloth: its weight grows evenly from nothing where it starts to hang to VINE_TIP_SWAY at the tip, over max(VINE_SPAN, its length), so strands up to the span share one slant and longer ones hang steeper; on top of the leaves' movement if leaves hold it, of none if anything else does (a vine under stone sways too). Only that part is pushed, easing in over its first block, and a push never calms it. With the leaves standing still the held blocks stand still and the free part sways all the same. The free part reads one wind reach for the whole strand (strandExposure) rather than a corner's, which twisted it near walls; the row it starts to hang from reads the corner, as the block holding it does, so the two never part.", "Only a block solid on that side counts as behind a strand, by the test the rain's wind uses for walls (WindShelter.isSolidSide): a torch, fence, slab or another vine is as good as nothing.", "The leaves group waves with the game's see-through leaves, and with its Fast leaves where the renderer can draw them solid too (WavingWhitelist.leavesWave / opaqueLeaves; GpuFoliageRenderer.canDrawOpaqueLeaves: every version, with the terrain's shaders, Sodium's and the mod's own, and through a shader pack whose solid programs the mod could copy). There every LeavesBlock, as vanilla's forceOpaque picks them, is meshed last and drawn with a copy of the pipeline without ALPHA_CUTOUT, the way vanilla's solid terrain differs from its cutout terrain: OPAQUE_PIPELINE, TERRAIN_OPAQUE_PIPELINE, SODIUM_OPAQUE_PIPELINE (Sodium's solid material, 1u), and through a shader pack the mod's copies of its TerrainSolid and ShadowSolid programs in a pipeline assigned to Iris's TERRAIN_SOLID. Faces between leaves are hidden by LeavesBlock.skipRendering, as in the chunk mesh. Elsewhere Fast leaves are left to the game and the checkbox greys out with a tooltip. Which leaves the game draws is read once a frame: cutoutLeaves from 1.21.11; before, Sodium's or Embeddium's own leaves quality, by reflection, else useFancyGraphics.", "Snow! Real Magic on Forge 1.20.1 draws the snow around its plants with minecraft:snow's model -- wrapped for snow on leaves -- and the plant's model data: ForgeFoliageModel never applies its plant-in-snow logic to a resting block's state, or the snow there vanished.", "Blocks resting on the leaves (restOnLeaves: minecraft:snow, the two moss carpets, and every block of vanilla's #wool_carpets tag, which mods' carpets join) are foliage only where they lie on a leaf while the leaves wave (GpuFoliageSplit.isFoliageAt / restsOnWavingLeaves, a position rule the model wrappers and the mesher ask): meshed as a field at the leaves' weight, every vertex reading the corner of the leaf's top under it whatever its own height (SwayAnchor.restY), so the whole layer moves as that leaf.", "Any other plant Sway hangs (pale hanging moss, cave vines, BOP's mosses...) follows the leaves the same way while it literally hangs from them (the block above its top), and is a plain plant otherwise."], "pitfalls": ["Fast leaves are still left to the game under a shader pack whose solid programs could not be built. Before 1.21.11 the solid leaves are drawn first with the solid layer's render state (RenderType.solid, mipmapped as the game's Fast leaves are) and a shader that keeps every pixel: LegacyTerrainShader's copy of rendertype_solid; with Sodium the mod's own shader, whose AlphaCutout uniform is set to 0 (0.1 for the cutout kind); through a shader pack the mod's copies of TerrainSolid and ShadowSolid as shader instances (IrisCompat.program(shadowPass, solid)), with Iris's phase set to solid terrain. The legacy region uploads copy each section's cutout part and solid part to their own places, as the newer one does: copying a section whole overwrote the next section's vertices. From 1.21.11 to 26.2 a shader pack's solid programs are copied as on 26.3 (TerrainSolid, and ShadowSolid keyed as the cutout shadow), each drawn by a pipeline of its own that IrisFoliageShaders.programFor answers for -- the shadow pass has its own pipeline before 26.3 -- with Iris's phase set to solid terrain for them. A shader pack that discards by the texture's alpha in its own shadow shader (Miniature) gives Fast leaves holed shadows, the game's own included; one that leaves it to Iris's alpha test (BSL) does not."], "fileInfo": {"WavingWhitelist.java": {"kind": "java", "lines": 450, "guard": "//? >=1.21.11 {"}}}, {"id": "sway-glsl", "label": "sway.glsl", "group": "shaders", "kind": "shader", "files": ["shaders/include/sway.glsl"], "summary": "The one place the motion is written: calm sway, pushes, rain wind. Spliced into every shader the foliage is drawn with: the mod's, the terrain's, Sodium's and a shader pack's.", "details": ["No function hands a value back through an 'out' parameter, and the pushes are read through mc2_cellPosition / mc2_cellForce: VulkanMod's shader converter drops the one and takes no arrays in a uniform block (see VulkanBridge)."], "fileInfo": {"shaders/include/sway.glsl": {"kind": "shader", "lines": 250, "guard": ""}}}, {"id": "sh-legacy", "label": "foliage_legacy*", "group": "shaders", "kind": "shader", "versions": ["<1.21.11"], "files": ["shaders/core/foliage_legacy.json", "shaders/core/foliage_legacy.vsh", "shaders/core/foliage_legacy.fsh", "shaders/core/foliage_legacy_1_20.json", "shaders/core/foliage_legacy_1_20.vsh"], "summary": "JSON ShaderInstance set. 1.21.1: foliage_legacy. 1.20.1: foliage_legacy_1_20 (own vsh with an attributes list; fog measured from the view), sharing the legacy fsh. The fsh discards below its AlphaCutout uniform: 0.1 as vanilla's cutout layer, 0 for leaves drawn solid.", "fileInfo": {"shaders/core/foliage_legacy.json": {"kind": "shader", "lines": 32, "guard": ""}, "shaders/core/foliage_legacy.vsh": {"kind": "shader", "lines": 249, "guard": ""}, "shaders/core/foliage_legacy.fsh": {"kind": "shader", "lines": 29, "guard": ""}, "shaders/core/foliage_legacy_1_20.json": {"kind": "shader", "lines": 33, "guard": ""}, "shaders/core/foliage_legacy_1_20.vsh": {"kind": "shader", "lines": 197, "guard": ""}}}, {"id": "sh-pipeline", "label": "foliage.vsh/.fsh", "group": "shaders", "kind": "shader", "versions": [">=1.21.11", "<26.3"], "files": ["shaders/core/foliage.vsh", "shaders/core/foliage.fsh", "shaders/core/foliage_terrain.vsh"], "summary": "RenderPipeline-era set (1.21.11-26.2). foliage_terrain.vsh is the placeholder name whose source TerrainFoliageShader builds.", "fileInfo": {"shaders/core/foliage.vsh": {"kind": "shader", "lines": 232, "guard": ""}, "shaders/core/foliage.fsh": {"kind": "shader", "lines": 26, "guard": ""}, "shaders/core/foliage_terrain.vsh": {"kind": "shader", "lines": 27, "guard": ""}}}, {"id": "sh-modern", "label": "foliage_modern", "group": "shaders", "kind": "shader", "versions": [">=26.3"], "files": ["shaders/core/foliage_modern.vsh", "shaders/core/foliage_modern.fsh", "shaders/include/foliage_uniforms.glsl"], "summary": "26.3's language: #include, a layout location on every input, compiled to SPIR-V by shaderc (VULKAN always defined). SwayCell at location 4, SwayWeights 5; the sway blocks in include/foliage_uniforms.glsl.", "pitfalls": ["26.3 reordered DynamicTransforms (ModelViewMat, TextureMat, ColorModulator, ModelOffset) and Globals."], "fileInfo": {"shaders/core/foliage_modern.vsh": {"kind": "shader", "lines": 48, "guard": ""}, "shaders/core/foliage_modern.fsh": {"kind": "shader", "lines": 28, "guard": ""}, "shaders/include/foliage_uniforms.glsl": {"kind": "shader", "lines": 26, "guard": ""}}}, {"id": "shader-sets", "label": "Shader set per jar", "group": "build", "kind": "rule", "files": [], "summary": "build-logic ModPlatformPlugin.configureProcessResources ships only the set a version loads: legacy (<1.21.1: legacy_1_20), pipeline (1.21.11-26.2), modern (26.3+).", "fileInfo": {}}, {"id": "shader-verify", "label": "Offline shader check", "group": "shaders", "kind": "rule", "summary": "Every shader step is compiled offline with the game's own shaderc options (Vulkan target, auto bind/map) before a test, and shown in game with a self-made visible test pack (red for terrain.vsh, blue for Sodium's block_layer_opaque).", "details": ["Test packs live in versions/<v>/run/resourcepacks, never in the repo."], "fileInfo": {}}, {"id": "terrain-shader", "label": "TerrainFoliageShader", "group": "terrain", "kind": "component", "versions": [">=1.21.11"], "files": ["gpu/TerrainFoliageShader.java"], "summary": "Draws foliage with the terrain's own shaders (vanilla's or a resource pack's core/terrain.*): fragment as is, vertex with the sway spliced in (Position renamed, main wrapped).", "details": ["26.3: reads minecraft:shaders/core/terrain.vsh/.fsh, expands the terrain's includes first (GameTime is only in them), splices, then expands the mod's; binds TerrainUniform and a per-region ChunkSection UBO.", "Only while Sodium does not draw the chunks.", "26.3: one compiled pipeline per variant asked for (cut out, and solid for Fast leaves), built from the one spliced source and closed together when the shaders reload."], "fileInfo": {"gpu/TerrainFoliageShader.java": {"kind": "java", "lines": 276, "guard": "//? >=1.21.11 {"}}}, {"id": "legacy-terrain", "label": "LegacyTerrainShader", "group": "terrain", "kind": "component", "versions": ["<1.21.11"], "files": ["gpu/LegacyTerrainShader.java"], "summary": "1.20.1-1.21.1: builds a ShaderInstance from the cutout layer's JSON (rendertype_cutout, following the names the JSON gives), with the sway spliced into its vertex shader; and a second one from the solid layer's (rendertype_solid), for leaves drawn solid. Each is built the first time it is drawn with after a resource reload.", "pitfalls": ["Skipped while Sodium draws the chunks: no core-shader support mod reaches Sodium there."], "fileInfo": {"gpu/LegacyTerrainShader.java": {"kind": "java", "lines": 285, "guard": "//? >=1.20.1 && <1.21.11 {"}}}, {"id": "terrain-slabs", "label": "Terrain Slabs", "group": "terrain", "kind": "compat", "files": ["gpu/TerrainSlabsCompat.java"], "summary": "Lowers plants on bottom slabs half a block, as Terrain Slabs does in its FRAPI wrapper, by the same rule (its OnTopHelper, found by MethodHandle). Soft: no mixin, missing or changed mod only logs a warning.", "details": ["No Terrain Slabs for 26.3 yet; expected to work unchanged if its helper keeps its name."], "fileInfo": {"gpu/TerrainSlabsCompat.java": {"kind": "java", "lines": 71, "guard": ""}}}, {"id": "sodium-bridge", "label": "SodiumBridge", "group": "sodium", "kind": "component", "files": ["gpu/SodiumBridge.java"], "summary": "Everything the renderer asks of Sodium, by reflection (Sodium is never on the compile classpath for this): whether it draws the chunks, whether meshes can be split, rebuild requests, visibility, and upload results.", "details": ["Package me.jellysquid before Sodium 0.6 (1.20.1), net.caffeinemc after.", "Forge 1.20.1: Embeddium, same Sodium 0.5 classes, mod ids embeddium/rubidium.", "Animated textures: Sodium only moves on the ones marked as on screen each frame, which its chunk meshes do for theirs; foliage the chunk mesh left out was never marked, so a firefly bush's glow stood still unless another was in view further out. A section remembers the animated textures met while it is meshed (Section.animatedSprites; from each quad from 26.1.2, from the block state's model, once per state, before) and collectDraws marks them each frame it is drawn (markActive), through Sodium's public SpriteUtil, the same from 0.5 to 0.9, or the class it grew out of on Embeddium. Tested on 26.3 Fabric so far."], "fileInfo": {"gpu/SodiumBridge.java": {"kind": "java", "lines": 323, "guard": "//? >=1.20.1 {"}}}, {"id": "sodium-upload", "label": "Sodium upload hook", "group": "sodium", "kind": "hook", "files": ["mixin/SodiumMeshSwapMixin.java"], "summary": "@Pseudo mixin on RenderRegionManager: where Sodium puts a finished build in place. The public overload is named with its descriptor (a private one of the same name reports each section twice).", "details": ["0.5 (1.20.1): uploadMeshes(CommandList, Collection)", "0.8 (1.21.1, 1.21.11): uploadResults(CommandList, Collection)", "0.9.2 on 26.1.2: uploadResults(CommandList, Collection, UniformBufferManager)", "0.9 on 26.2/26.3: uploadResults(Collection, UniformBufferManager)", "BuilderTaskOutput's section field: render (0.8), section (0.9)."], "fileInfo": {"mixin/SodiumMeshSwapMixin.java": {"kind": "java", "lines": 64, "guard": "//? >=1.20.1 {"}}}, {"id": "sodium-shader", "label": "SodiumFoliageShader", "group": "sodium", "kind": "component", "versions": [">=1.21.11"], "files": ["gpu/SodiumFoliageShader.java"], "summary": "Draws foliage with a copy of Sodium's own chunk shaders (sodium:blocks/block_layer_opaque, or a pack's), adapted to the mod's vertices and uniforms.", "details": ["1.21.11 (0.8): sources from ShaderLoader, #import expanded; packs need Sodium Core Shader Support.", "26.1.2: hybrid: 0.8 loading, 0.9 content.", "26.2+: vanilla ShaderManager, #moj_import / #include; u_SectionTimeInfo replaced, push_constant blocks stripped (VULKAN defined).", "26.3: #include IMPORT pattern, BuiltSource, compiled via compilePipeline(...).finishCompile(), cached per SOLID_TERRAIN identity; one copy per variant, the solid one without ALPHA_CUTOUT and with Sodium's solid material.", "Sodium 0.8 (1.21.11) and 0.9.2 (26.1.2) tell the solid pass apart the same way, 0.9.1 (26.2) by leaving ALPHA_CUTOUT out: one pair of shaders for every pass; the solid pass is compiled without USE_FRAGMENT_DISCARD and its vertices carry the solid material (1u, cutoff 0), so the solid copy drops that define, and names RENDER_PASS_SOLID in place of RENDER_PASS_CUTOUT for Sodium Core Shader Support's packs. The game keeps compiled shaders by name before 26.3, so the solid copy has a name of its own (SHADER_OPAQUE) for SODIUM_OPAQUE_PIPELINE; where it does not compile the leaves are drawn cut out."], "fileInfo": {"gpu/SodiumFoliageShader.java": {"kind": "java", "lines": 624, "guard": "//? >=1.21.11 {"}}}, {"id": "indium", "label": "Indium", "group": "external", "kind": "mod", "loaders": ["fabric"], "versions": ["<1.21.1"], "summary": "Fabric 1.20.1 with Sodium 0.5 needs Indium for FRAPI: without it neither Sway nor the mod's model run under Sodium, and the GPU mode stays off with a warning. Publish-only required dependency.", "fileInfo": {}}, {"id": "embeddium", "label": "Embeddium", "group": "external", "kind": "mod", "loaders": ["forge"], "versions": ["<1.21.1"], "summary": "Forge 1.20.1's Sodium port (Sodium 0.5 classes). The renderer button is greyed out on GPU with it; far foliage stays still (accepted).", "fileInfo": {}}, {"id": "sodium", "label": "Sodium", "group": "external", "kind": "mod", "summary": "Owns chunk meshing and drawing when installed. Versions: 0.5 (1.20.1), 0.8 (1.21.1, 1.21.11), 0.9.2 (26.1.2+).", "details": ["NeoForge's jar carries the mod as a jar-in-jar; on 26.3 its classes and shaders are byte-identical to Fabric's except three of its own mixins.", "Its terrain setup runs inside LevelExtractor.extract (at consumeFrustumUpdate) on 26.3, before the end-of-extraction events."], "fileInfo": {}}, {"id": "iris-compat", "label": "IrisCompat", "group": "iris", "kind": "component", "files": ["gpu/IrisCompat.java"], "summary": "The gate: answers the renderer's shader pack questions without loading Iris classes when Iris is absent. Where the support is not compiled (nowhere at present), an installed Iris counts as a pack always loaded with no programs, so the chunk mesh keeps the foliage.", "fileInfo": {"gpu/IrisCompat.java": {"kind": "java", "lines": 269, "guard": "//? >=1.20.1 {"}}}, {"id": "iris-shaders", "label": "IrisFoliageShaders", "group": "iris", "kind": "component", "files": ["gpu/IrisFoliageShaders.java", "mixin/iris/IrisRenderingPipelineAccessor.java", "mixin/iris/ShaderCreatorMixin.java", "mixin/iris/IrisMixinPlugin.java"], "summary": "Per pack, builds copies of the pack's programs (terrain cutout, shadow cutout; also solid terrain and solid shadow, for Fast leaves) through Iris's own createShader/createShadowShader, with sway.glsl spliced into the translated vertex shader (iris_Position replaced).", "details": ["ShaderCreatorMixin redirects TransformPatcher.patchVanilla only while building (26.3 adds a Set<String> textureOverrides parameter).", "Meshes with the block ids the pack expects (BlockSensitiveBufferBuilder.beginBlock) in Iris's terrain format plus the two sway values.", "A new pack or none: deactivate and re-mesh."], "pitfalls": ["IrisMixinPlugin.getMixins must return nothing without Iris: Mixin never asks shouldApplyMixin for companion mixins (a laptop without Iris crashed on this)."], "fileInfo": {"gpu/IrisFoliageShaders.java": {"kind": "java", "lines": 843, "guard": "//? iris {"}, "mixin/iris/IrisRenderingPipelineAccessor.java": {"kind": "java", "lines": 91, "guard": "//? iris {"}, "mixin/iris/ShaderCreatorMixin.java": {"kind": "java", "lines": 73, "guard": "//? iris {"}, "mixin/iris/IrisMixinPlugin.java": {"kind": "java", "lines": 85, "guard": "//? iris {"}}}, {"id": "iris-inject", "label": "Pack program injection", "group": "iris", "kind": "hook", "files": ["mixin/iris/GlDeviceMixin.java", "mixin/iris/ExtendedShaderMixin.java"], "summary": "How the copy reaches the draw. <1.21.11: the ShaderInstance is used directly. 1.21.11-26.2: GlDeviceMixin returns a GlRenderPipeline around the copy; ExtendedShaderMixin adds the sway blocks. 26.3: IrisApi.assignPipeline + withFoliageProgram swaps the copy into Iris's own pipeline.", "details": ["1.21.1: Iris returns ShaderInstance (ExtendedShader, iris_-prefixed uniforms), sway uniforms set by raw GL, push block bound at index 12; Iris closes those programs itself.", "26.3: Iris binds blocks only by known names (0-6), so the sway blocks go to the top two GL_MAX_UNIFORM_BUFFER_BINDINGS points, bound with glBindBufferBase before the draws (never hard-code points).", "26.3: wrappers share one program; close their VertexArrays and the program once."], "fileInfo": {"mixin/iris/GlDeviceMixin.java": {"kind": "java", "lines": 34, "guard": "//? >=1.21.11 && iris && <26.3 {"}, "mixin/iris/ExtendedShaderMixin.java": {"kind": "java", "lines": 43, "guard": "//? >=1.21.11 && iris && <26.3 {"}}}, {"id": "iris-shadow", "label": "Pack shadow map", "group": "iris", "kind": "hook", "files": ["mixin/iris/ShadowRendererMixin.java", "gpu/IrisFoliageShaders.java"], "summary": "Plants cast swaying shadows. <26.1.2: ShadowRendererMixin at the point a callback would be. 26.1.2+: IrisApi.registerShadowRenderCallback. 26.3: plus assignPipelineShadow and drawIntoShadowMap in a pass of the mod's own.", "details": ["26.2: a pre-flipped depth pipeline (Iris only flips depth for pipelines it knows).", "26.3: Iris flips depth and disables cull for every pipeline in the shadow pass; the callback runs with no pass open, before addMainPass; fog must be bound by hand. Solid leaves are drawn there with the solid shadow copy."], "fileInfo": {"mixin/iris/ShadowRendererMixin.java": {"kind": "java", "lines": 36, "guard": "//? iris && <26.1.2 {"}, "gpu/IrisFoliageShaders.java": {"kind": "java", "lines": 843, "guard": "//? iris {"}}}, {"id": "iris-vertex", "label": "IrisVertexExtension", "group": "iris", "kind": "component", "files": ["gpu/IrisVertexExtension.java"], "summary": "Keeps Iris from widening the mod's BLOCK-format meshing buffer when the mod meshes for its own pipeline (ImmediateState.skipExtension), and lets it while the mod meshes for a pack, raising ImmediateState.isRenderingLevel itself meanwhile: Iris widens only under it, and from 1.11.7 no longer holds it while a frame is extracted, which is when 26.3 meshes. 1.20.1's Iris/Oculus has no such switch.", "fileInfo": {"gpu/IrisVertexExtension.java": {"kind": "java", "lines": 123, "guard": "//? >=1.20.1 {"}}}, {"id": "iris", "label": "Iris", "group": "external", "kind": "mod", "summary": "Fabric on every version; NeoForge from 1.21.1 (26.3 from Iris 1.11.7, whose classes shared with Fabric's are byte for byte the same). OpenGL only.", "details": ["Debug: enableDebugOptions=true in run/config/iris.properties dumps translated programs to run/patched_shaders."], "fileInfo": {}}, {"id": "oculus", "label": "Oculus", "group": "external", "kind": "mod", "loaders": ["forge"], "versions": ["<1.21.1"], "summary": "Iris on Forge 1.20.1, mod id oculus (Forge ignores the iris id it provides). Same code as Iris 1.7.", "fileInfo": {}}, {"id": "polytone-shadow", "label": "ShadowMapRendererMixin", "group": "polytone", "kind": "hook", "versions": [">=1.21.1", "<26.3"], "files": ["mixin/polytone/ShadowMapRendererMixin.java", "mixin/polytone/PolytoneMixinPlugin.java"], "summary": "Draws the GPU foliage into Polytone's shadow map once its terrain is in it, before the entities. Targets by name, not compiled against Polytone; the method is render or renderShadowMap depending on the release.", "details": ["Config is required:false and gated by PolytoneMixinPlugin; excluded from the jar on 1.20.1 and 26.3."], "fileInfo": {"mixin/polytone/ShadowMapRendererMixin.java": {"kind": "java", "lines": 50, "guard": "//? >=1.21.1 && <26.3 {"}, "mixin/polytone/PolytoneMixinPlugin.java": {"kind": "java", "lines": 60, "guard": "//? >=1.21.1 {"}}}, {"id": "polytone", "label": "Polytone", "group": "external", "kind": "mod", "versions": [">=1.21.1"], "summary": "Has a shadow map from 1.21.1 (not 1.20.1). No Polytone for 26.3 yet.", "fileInfo": {}}, {"id": "vulkan-bridge", "label": "VulkanBridge", "group": "vulkanmod", "kind": "component", "loaders": ["fabric"], "files": ["gpu/VulkanBridge.java", "mixin/VulkanMeshSwapMixin.java", "gpu/VulkanLegacyDraw.java", "gpu/VulkanFoliageShader.java"], "summary": "What the renderer asks of VulkanMod, by name (never compiled against it): whether it draws the chunks, whether a model is asked for by one of its chunk builds (its RenderRegion), and when a finished build is put in place (TaskDispatcher.doSectionUpdate, a @Pseudo mixin, which hands the section over as Sodium's uploads do).", "details": ["Two ways through it. From VulkanMod 0.6.8 (1.21.11, 26.1.2) it stands in for the game's graphics device, so the own-pass draw path runs through it unchanged. On 0.6.7 (1.21.1) it stands in for OpenGL call by call, and not for the calls drawLegacy makes (a uniform block bound by hand, a draw from a base vertex, glBufferSubData), so the foliage is drawn through VulkanMod's own interface instead: VulkanLegacyDraw. On 0.5.2 (1.20.1) its chunk builds are not recognised and the renderer stays out (keepsRendererOut); Sway still moves the foliage. Tested on 1.21.1, 1.21.11 and 26.1.2 Fabric.", "VulkanLegacyDraw (1.21.1): the shader classes of 0.6.7 are those of 0.6.8, so a pipeline is built the same way, from Vulkan GLSL the mod generates (VulkanFoliageShader: VulkanMod's terrain look -- colour times lightmap, cutout, linear fog -- with the sway; named fields only, the pushes as 64 matrices). Its values are suppliers the mod puts into VulkanMod's public maps (Uniforms.vec4f_uniformMap and its like) over buffers it writes before drawing; VulkanMod copies them each time the pipeline's uniforms are bound, so the region's offset can change between draws. A region is still uploaded as one of the game's vertex buffers, which VulkanMod emulates; the Vulkan buffer behind it is found by the types of two fields (VBO, then its VertexBuffer). VulkanMod's own draw call has no base vertex, so a run is drawn by recording vkCmdBindVertexBuffers and vkCmdDrawIndexed directly into its command buffer, with its shared quad indices. Region.patch does nothing there (whole upload), the legacy shader's OpenGL set-up is skipped, and the colour swap below does not apply (0.6.7 leaves VertexConsumer.putBulkData alone). Shadow passes are not drawn on this path yet.", "The foliage is drawn with the mod's own shader, never the terrain's: VulkanMod reads its terrain shaders from its own jar, which no resource pack replaces.", "Its shader converter (0.6.8's GLSLParser; the repository's dev branch has since replaced it) takes no arrays, structs or bools in a uniform block, so under the define MC2_NO_UNIFORM_ARRAYS foliage.vsh lays each vec4[128] out as 32 mat4 with the same bytes. It also drops the 'out' of a function's parameter, leaving the value undefined: no function in sway.glsl or the legacy vertex shaders hands a value back through a parameter. That one put every plant half a block off in height per block of north-south distance to the camera.", "It overwrites VertexConsumer.putBulkData and packs the colour with red and blue changed over, right for its own buffers only; the 1.21.1-1.21.11 vertex writer changes them back.", "It writes a non-mappable buffer through a staging copy, once a frame before the frame's draws run: such a buffer written twice in a frame shows every draw its last write.", "Read the jar, not GitHub: decompile it and diff the converter's output against its input for every shader, compiling is not enough."], "fileInfo": {"gpu/VulkanBridge.java": {"kind": "java", "lines": 171, "guard": "//? >=1.20.1 {"}, "mixin/VulkanMeshSwapMixin.java": {"kind": "java", "lines": 32, "guard": "//? >=1.20.1 {"}, "gpu/VulkanLegacyDraw.java": {"kind": "java", "lines": 463, "guard": "//? >=1.20.1 {"}, "gpu/VulkanFoliageShader.java": {"kind": "java", "lines": 177, "guard": ""}}}, {"id": "vulkanmod", "label": "VulkanMod", "group": "external", "kind": "mod", "loaders": ["fabric"], "versions": ["<26.2"], "summary": "Replaces the OpenGL renderer with Vulkan and owns chunk meshing and drawing, shaped like Sodium. Fabric only. 0.5.2 (1.20.1), 0.6.7 (1.21.1), 0.6.8 (1.21.11, 26.1.2); none from 26.2, where the game has its own Vulkan backend.", "fileInfo": {}}, {"id": "beryl-bridge", "label": "BerylBridge", "group": "vulkanmod", "kind": "component", "loaders": ["fabric"], "files": ["gpu/BerylBridge.java", "gpu/BerylFoliageShader.java", "mixin/BerylShadowMixin.java"], "summary": "Lights the foliage as Beryl lights its terrain and draws it into Beryl's shadow map. Beryl puts one of its Vulkan pipelines under the game's render pipelines while its shaders are on (ShaderRenderPipeline.redirectPipeline); the mod does the same for its own: a pipeline built from Beryl's terrain shaders while Beryl draws the terrain, one from its shadow shaders while it draws its shadow map, none otherwise. Everything by name, never compiled against.", "details": ["BerylFoliageShader copies Beryl's vertex shader from its jar as the game runs and changes it in place: plain vertices instead of VulkanMod's compressed ones (Beryl's source carries both), the region's corner from the mod's transform instead of Beryl's push constant and section block, the block id's input given to SwayCell and SwayWeights, the sway before anything is worked out from the position. Each change has to find its place exactly once; where one does not there is no copy and the foliage stays on the mod's own shader. Beryl's fragment shaders are used untouched.", "Uniforms: Beryl's shared blocks are filled by VulkanMod from suppliers it looks up by field name (MVP, LightSpaceMat, LightDir...). A block declared by its size alone is named \"UBO <binding>\" and is bound from the render pass when the pass holds a uniform of that name, which is how the region's transform, the game's globals, the sway settings and the pushes get in. VulkanMod lays a pipeline's bindings out by number, so they must be contiguous: the region takes binding 2 (Beryl's section block), the other three follow Beryl's last texture (6 on, or 8 on with coloured shadows; 5 on in the shadow pipeline).", "Colours: Beryl overwrites BufferBuilder.setColor(int) to raise colours to 2.2 for as long as it draws a frame (RenderingPipeline.useSrgbColors), and its terrain shader does so again. The 1.21.1-1.21.11 vertex writer writes the colour raised to 1/2.2 while that is on, so the buffer always holds the plain colour.", "Shadow map: BerylShadowMixin (@Pseudo, ShadowMap.renderShadowMap, at the VRenderSystem.applyProjectionMatrix call between Beryl's terrain and its entities) calls drawBerylShadow, which draws every section near the player into the targets Beryl has the game draw entity shadows into (RenderSystem.outputColorTextureOverride / outputDepthTextureOverride). The shadow shader places vertices by LightSpaceMat alone, so no matrix is handed over. Nothing is drawn unless Beryl's shadow pipeline went under the mod's.", "Vertex inputs: VulkanMod numbers them by their place in the vertex format, and the game's block format has a normal on 1.21.11 and none from 26.1.2, so the normal's place and the sway values' are read from the format and written into the copy. Where there is no normal the copy declares a zero one: a normal looking up makes Beryl look a shadow up as far as 0.6 blocks toward the sun (LightSpaceOffset, meant for the ground), which let a plant miss the shadow of the plant in front of it at a low sun.", "Materials: Beryl picks a block's material by an id from a fixed list of its own (ShaderRendererResources.getBlockId): 13, lit by the sky from either side, for about seventeen vanilla plants; lit by which way each face looks for everything else, leaves and every modded plant among them. On 1.21.11 the vertex writer puts that id above the light (UV2.x, bits 8 up; materialBits) and the copy picks the material by it, taking the light from under it; the mod's own shader does the same through mc2_light, inside its VulkanMod branch. From 26.1.2 there is no normal to light a face by, so every plant gets material 13 there: leaves and unlisted plants are lit from behind where Beryl's own would be dark.", "Rebuilt when Beryl's options change (coloured shadows, textured sun, waving water, SSR: they are defines of its shaders). Written against Beryl 0.2.1-alpha and VulkanMod 0.6.8; tested on 1.21.11 and 26.1.2 Fabric (light, tint, shadows received and cast).", "1.21.1 (Beryl 0.2.0, VulkanMod 0.6.7): there is no render pipeline of the game's to put anything under, and the foliage is drawn through VulkanLegacyDraw, so that binds a pipeline of Beryl's in place of its own: legacyLit while Beryl's stage is TERRAIN, legacyShadow while it is SHADOW_MAP (the same mixin hook; nothing is drawn into the shadow map without it, no render state is set there, since a render type's would bind the main target, and VulkanMod's matrices are left as Beryl set them). The copies are made by the same BerylFoliageShader (legacyVertex), with what the sway reads declared as named fields (VulkanFoliageShader.swayDeclarations) at the two bindings after Beryl's own: 5 on for the terrain (7 with coloured shadows), 4 on for the shadow map, whose blocks are the ones in Beryl's shadow.json. 0.2.0's terrain shader has no section block and three options; the block id rides above the light as on 1.21.11. Tested on 1.21.1 Fabric (light, shadows received and cast)."], "fileInfo": {"gpu/BerylBridge.java": {"kind": "java", "lines": 681, "guard": "//? >=1.20.1 {"}, "gpu/BerylFoliageShader.java": {"kind": "java", "lines": 202, "guard": ""}, "mixin/BerylShadowMixin.java": {"kind": "java", "lines": 34, "guard": "//? >=1.20.1 {"}}}, {"id": "sable-bridge", "label": "SableBridge", "group": "sable", "kind": "component", "versions": ["1.21.1"], "files": ["gpu/SableBridge.java", "gpu/SubLevelFoliageShader.java", "shaders/include/sublevel.glsl"], "summary": "A sub-level's blocks are kept in a plot of the same level, twenty million blocks away, and drawn where the sub-level is under a pose (position, rotation, the point of the plot it turns about). The bridge says whether a chunk column lies in a plot and gives a sub-level's pose, through Sable Companion (MIT, by name); the renderer does the rest with what it already has.", "details": ["Discovery: Sable builds a plot's sections with the game's own section compiler, with Sodium too (its only two renderers in 2.0.6: vanilla and Sodium reach-around), so they reach the foliage models as any chunk build. GpuFoliageSplit.decide notes a plot section whose build kept its foliage (PLOT_FOUND) whether or not the renderer has an area yet -- Sable builds as the world is first drawn and as a shader pack is switched, before the renderer's first frame after either -- and followSubLevels takes it up: owner, plot column counted as near, queued. From there the section changes hands as the world's do; the request to build again is one Sable answers for its own sections.", "Drawing (drawSubLevels): with the camera put inside the plot (the pose undone), pose(p) - camera = R(p - cameraInPlot). So a sub-level's regions go through drawLegacy unchanged with that camera and the view times the rotation: offsets, sway and fog stay valid. No frustum culling, no wind edge (subLevelPass). Regions carry their sub-level (a plot is 128 chunks wide and starts where a region does); collectDraws takes the world's or one sub-level's.", "Shade: where Sable's dynamic shading is on (SableBridge.shadesByFacing, an internal flag) it meshes sub-levels with no shade and shades in the shader by the turned normal. The renderer does the same: UnshadedLevel hands the block renderer full shade and notes per quad whether it takes any; one that takes none is written with no normal (up, under a shader pack, as Sable does), and mc2_subLevelShade in foliage_legacy.vsh and the LegacyTerrainShader splice applies Veil's block_brightness to the rest.", "Pushes: Sway looks for plants around an entity where the entity is. pushSubLevelPlants turns each nearby entity's box into the plot (its eight corners through the pose undone, the box that holds them), gives it to a stand-in Marker that is in no level, and calls Sway's private SwayEngine.processBlock for every block the box reaches; Sway reads nothing of an entity but its box. The forces go through the same springs, and each pass sends the cells within 256 blocks of the camera it is drawn from.", "Shader packs: the same passes inside the pack's terrain phase and, from drawShadow, into its shadow map; Iris works its inverse and normal matrices out from the model view as the program is applied. With Sodium on NeoForge the frame hook's stage fires again inside Iris's shadow pass with the sun's matrices: draw() returns while IrisCompat.renderingShadows(), or what nothing culled went onto the screen as the sun sees it.", "What a sub-level alone does to the sway is in shaders/include/sublevel.glsl, put after sway.glsl by SubLevelFoliageShader in the terrain copy and the shader pack copy (no preprocessor line left: Iris parses before any compiler), and followed by hand in foliage_legacy.vsh. sway.glsl itself is untouched: its wind direction and the line that moves a vertex are swapped in the copy, where found worded as today. Level sway: what of the sway and the wind runs along the world's up is taken out (mc2_subLevelLevel), so a plant on a sub-level lying over never bobs; a push is left alone. Wind: rain's blows the world's west as the plot sees it, and where it meets a plant head on the plant shakes a little instead (leaves by vertex position, so shared corners move together). Hang: mc2_SubLevelHang, by Sway's push curve, so leaves keep their place.", "Swing (swingSubLevels): each sub-level tows a weight on a spring kept in world space; the tips hang down (0.9 block for a plant lying flat) plus the weight's lag times a throw, minus the sub-level's own eased speed times a trail, turned into the plot each frame. So foliage streams behind a moving sub-level, runs on past one that stops and settles. Speed comes from the pose between frames, nothing of Sable's. One swing per sub-level, at its rotation point: a piece spinning in place does not throw its foliage. Constants settled by eye with the user (stiffness 20, damping 2, throw 2.5, trail 0.35).", "Veil, which Sable brings, rebuilds a vanilla shader's program as it is applied: see GpuFoliageInteraction for the uniform block binding. Tested with Sable 2.0.6 and treephysics on NeoForge 1.21.1: vanilla, Sodium, Iris with BSL. Not drawn into Polytone's shadow map; a sub-level is followed for as long as it exists. The file mc2-foliage-sable in the game folder logs what is found and drawn."], "fileInfo": {"gpu/SableBridge.java": {"kind": "java", "lines": 161, "guard": "//? >=1.20.1 {"}, "gpu/SubLevelFoliageShader.java": {"kind": "java", "lines": 82, "guard": "//? >=1.20.1 {"}, "shaders/include/sublevel.glsl": {"kind": "shader", "lines": 92, "guard": ""}}}, {"id": "sable", "label": "Sable", "group": "external", "kind": "mod", "versions": ["1.21.1"], "summary": "Moving block structures with physics (sub-levels), by RyanHCode; bundles Veil and Sable Companion. Fabric and NeoForge, 1.21.1 only. In a Fabric dev run its entrypoint fails on an older night-config ahead of its own on the classpath: test in a launcher or on NeoForge.", "fileInfo": {}}, {"id": "beryl", "label": "Beryl", "group": "external", "kind": "mod", "loaders": ["fabric"], "versions": ["<26.2"], "summary": "A shader renderer for VulkanMod by the same author: not shader packs, one built-in set of shaders (shadow map, materials by block id, bloom, SSR, tone mapping), toggled by a key. Draws in plain light and converts at the end. 0.2.0 (1.21.1), 0.2.1 (1.21.11, 26.1.2).", "fileInfo": {}}, {"id": "srm", "label": "Snow! Real Magic", "group": "external", "kind": "mod", "summary": "Lets snow settle on plants: the plant's block becomes one of its snow blocks, which keeps the plant in its block entity (SnowBlockEntity.getContainedState) and draws it through the plant's own model, at the same position, before the snow. Grass, ferns, tall grass, large ferns and berry bushes get a snowy variant model (declared in .mcmeta files, kept in its SnowVariantModel wrapper).", "details": ["Fabric: draws through Fabric's rendering API (SnowCoveredModel.emitBlockQuads).", "Forge: carries its own copy of Fabric's rendering API and Indigo (jar-in-jar); SnowVariantModel only picks the variant through emitBlockQuads, never getQuads.", "Plants it raises onto the snow are tagged snowrealmagic:offset_y (+0.101).", "10.x (1.20.1): one snow block holds plants, snowrealmagic:snow (EntitySnowLayerBlock); the snowy variants are mapped in SnowClient.snowVariantMapping.", "12.x (1.21.1): five SRMSnowLayerBlock blocks with the same SnowBlockEntity -- snow, snow_extra_collision, snowy_plant, and snowy_double_plant_lower/_upper, one per half of a tall plant; the snowy variants are mapped in ClientHooks.snowVariantMapping."], "fileInfo": {}}, {"id": "srm-compat", "label": "SnowRealMagicCompat", "group": "snowrealmagic", "kind": "compat", "files": ["gpu/SnowRealMagicCompat.java", "ModCompatRegistry.java"], "summary": "Read by name, never compiled against. Finds the plant a snow block holds, the snowy variant of a plant's model (walking the wrappers' wrapped/parent/originalModel fields), whether a model is drawn inside the snow (Forge: the snow's OPTIONS model property) and whether a tall plant's top half stands on it. Tested on 1.20.1 Fabric and Forge (vanilla and Embeddium) 1.21.1 Fabric (vanilla and Iris), 1.21.1 NeoForge (vanilla, Sodium and Iris), and 26.1.2 Fabric and NeoForge (vanilla, Sodium and Iris).", "details": ["Snow blocks are found by class (EntitySnowLayerBlock up to 10.x, SRMSnowLayerBlock from 12.x) once, then looked up by identity.", "Sway: ModCompatRegistry gives every snow block that holds plants a pipeline that only pushes (collision, proximity force, multiplier), no deformation: Sway pushes a position by its block, and the plant drawn there bends by its own pipeline. A deforming pipeline would bend the snow and the plant twice.", "GpuFoliageSplit.bends: foliage is what Sway bends, so the snow block is never wrapped, meshed or given a forced render layer; the plant inside it is.", "GPU mesher: a snow block holding a Sway plant meshes the plant (raised as offset_y says, not at 8 layers), with its snowy variant; the anchor and a tall plant's length read the plant inside the snow.", "The plant inside changes through its block entity: ClientLevelMixin follows ClientLevel.sendBlockUpdated for the snow block.", "GPU: a plant under the snow (held in it, or a tall plant's top half on it) keeps SNOW_LADEN_SWAY (20%) of its calm sway and SNOW_LADEN_WIND (80%) of the weather's wind; pushes are untouched. It is meshed with the wind's share of its wave weight and marked still without steady, a pair nothing else sets, which the shaders read as keeping MC2_LADEN_CALM (0.25, the one over the other) of the calm sway: sway.glsl, and LADEN_CALM in both legacy vsh. Leaves under snow keep the one 20% for both, so they never part from their neighbours. No shader changes.", "snowVariants off in its client config: the plain model everywhere, as the chunk mesh."], "pitfalls": ["Forge and NeoForge force cutoutMipped on the blocks the mod registers (Sway's wrapper loses the render layer); only on blocks Sway bends: on the snow block it hid the snow (solid) and the plant (its own layer) entirely.", "Forge: Sway wraps every interactive block's state model, the push-only snow too, and its wrapper tells Indigo the model is plain; ForgeFoliageHooks unwraps blocks Sway only pushes. Each mod has its own mod event bus, so EventPriority only orders listeners within the mod's own bus.", "Forge dev: third-party mods must come through modRuntimeOnly (remapped), never raw jars in run/mods (their SRG mixins fail); Snow! Real Magic 10.7.0 is maven.modrinth:iJNje1E8:aQw97T9l, Kiwi 11.10.3 is ufdDoWPd:NSxwah05.", "Fabric 1.21.1 dev: Iris 1.8.14-beta.1 fails its mixins in the dev client; test Iris with the built jar in a launcher instance.", "NeoForge 1.21.1: Sway wraps the push-only snow's model too (as on Forge) and its wrapper says the model is plain, so Indigo drew the snow alone and the plant inside vanished on the CPU; NeoforgeFoliageHooks unwraps blocks Sway only pushes.", "SRM 12.x (NeoForge) can mark a snowy variant required (drawn even with snowVariants off); snowyVariantOf follows the config only.", "26.1.2 (SRM 26.0.x): the snowy variant lives in each part (SnowyBlockStateModelPart: normal + snowy), picked only when drawn through SRM's own emitter (SRMQuadEmitter) -- inside the snow always, a tall plant's top half on it while snowVariants is on. The GPU mesher asks parts through collectParts, so snowyVariant hands it a model whose parts are the snowy ones (field snowy, by reflection); NeoForge's Sway wraps each part in one that only has getQuads, so NeoforgeFoliageModel.collectParts hands Sway the snowy parts (snowyParts) before it wraps them.", "NeoForge 26.1.2: Forgified Fabric API draws every chunk block through emitQuads (its SectionCompilerMixin), and a non-Fabric model's default emitQuads is collectParts: Sway's wrapper around the push-only snow skipped SRM's drawing, so NeoforgeFoliageHooks.unwrapPushedOnly (LOWEST) unwraps it there too.", "Kiwi 26.0.20 (SRM's library) crashes opening the inventory on NeoForge 26.1.2.109: its EffectsInInventoryMixin targets renderText, which NeoForge renamed extractText. Not ours;
