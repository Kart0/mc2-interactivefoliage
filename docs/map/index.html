<title>MC2 Foliage Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night canopy. The constellation fills the stage, a reading panel sits to its right (below it on phones);
   version and loader filters ride in the top bar like a field guide's tabs. Deliberately one dark look. */
:root {
  --ground: #0d1613;
  --ground-2: #121e1a;
  --panel: #16231f;
  --line: #26372f;
  --fg: #e3ebdd;
  --muted: #94a89c;
  --faint: #5f7268;
  --pollen: #e8c36a;
  --warn: #f09a72;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --g-core: #7fd49a; --g-split: #b7d46c; --g-motion: #8ecae9; --g-shaders: #b8a4f0; --g-terrain: #d9a97a;
  --g-sodium: #8fe0cc; --g-iris: #f0a2c9; --g-polytone: #f2d27a; --g-loader: #aeb8ff; --g-build: #a4ada8;
  --g-external: #e6ddcb; --g-version: #e8c36a; --g-snowrealmagic: #a9dcff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--fg); font: 15px/1.5 var(--body); }
.app { display: flex; flex-direction: column; height: 100%; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px 12px;
  border-bottom: 1px solid var(--line); background: var(--ground-2); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1.1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs { margin-left: auto; }
button { font: inherit; color: inherit; }
.tab, .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px;
  cursor: pointer; font-size: 13px; color: var(--muted); }
.tab[aria-pressed="true"], .chip[aria-pressed="true"] { color: var(--ground); background: var(--pollen); border-color: var(--pollen); }
.tab:focus-visible, .chip:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--pollen); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.filters label.cap { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.fgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#search { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 5px 10px;
  width: 220px; max-width: 100%; font: 13px var(--body); }

main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; }
.legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 28px);
  font-size: 12px; color: var(--muted); pointer-events: auto; }
.legend button { background: none; border: 0; padding: 2px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend button[aria-pressed="false"] { opacity: 0.35; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }

aside { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 22px 28px; }
aside h2 { margin: 0 0 4px; font: 700 21px/1.2 var(--display); text-wrap: balance; }
aside h3 { margin: 22px 0 8px; font: 600 11px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
aside p { margin: 0 0 10px; }
aside ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.tag { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--ground); border: 1px solid var(--line); color: var(--muted); }
.tag.group { color: var(--ground); border: 0; }
.pitfalls li { color: var(--warn); }
.pitfalls li span { color: var(--fg); }
.files { list-style: none; padding: 0 !important; }
.files li { display: flex; justify-content: space-between; gap: 10px; font: 12px/1.4 var(--mono); border-bottom: 1px dashed var(--line); padding: 4px 0; }
.files li code { overflow-wrap: anywhere; min-width: 0; }
.files li em { font-style: normal; color: var(--faint); white-space: nowrap; }
.links { list-style: none; padding: 0 !important; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--fg); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.links li { font-size: 14px; }
.links li small { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stats b { display: block; font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }

.view { flex: 1; overflow: auto; padding: 22px 20px 40px; min-width: 0; }
.view h2 { font: 700 22px var(--display); margin: 0 0 6px; }
.view > p { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; min-width: 980px; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
thead th { font: 700 15px var(--display); background: var(--ground-2); position: sticky; top: 0; }
thead th.sel { color: var(--pollen); }
tbody th { font-weight: 600; color: var(--muted); width: 150px; background: var(--ground-2); }
td.sel { background: rgba(232, 195, 106, 0.06); }
td .ld { display: block; }
td .ld b { font: 500 11px var(--mono); color: var(--faint); margin-right: 4px; }
ol.recipe { max-width: 75ch; display: grid; gap: 12px; padding-left: 22px; }
ol.recipe li::marker { font: 700 15px var(--display); color: var(--pollen); }
.rules { max-width: 75ch; display: grid; gap: 8px; padding-left: 18px; color: var(--muted); }

svg text { font-family: var(--body); pointer-events: none; }
@media (max-width: 860px) {
  main { flex-direction: column; }
  .stage { flex: none; height: 62vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); flex: none; }
  .tabs { margin-left: 0; }
  header, .filters { padding-inline: 16px; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="brand"><h1>MC2 Foliage Atlas</h1><span id="subtitle">every piece, every version</span></div>
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" id="tab-map" aria-pressed="true">Constellation</button>
      <button class="tab" id="tab-matrix" aria-pressed="false">Versions</button>
      <button class="tab" id="tab-recipe" aria-pressed="false">Port recipe</button>
    </div>
  </header>
  <div class="filters">
    <div class="fgroup"><label class="cap">Version</label><div class="chips" id="versions"></div></div>
    <div class="fgroup"><label class="cap">Loader</label><div class="chips" id="loaders"></div></div>
    <div class="fgroup"><label class="cap" for="search">Find</label><input id="search" type="search" placeholder="Sodium, setSectionMesh, sway.glsl…" autocomplete="off"></div>
  </div>
  <main id="main-map">
    <div class="stage"><svg id="graph" role="img" aria-label="Constellation of the mod's pieces"></svg><div class="legend" id="legend"></div></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
  <main id="main-matrix" hidden><div class="view" id="matrix"></div></main>
  <main id="main-recipe" hidden><div class="view" id="recipe"></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = {"meta": {"title": "MC2 Foliage Atlas", "about": "How MC2 Interactive Foliage works on every Minecraft version and loader it supports: its pieces, what each one hooks into, and every compatibility layer. Hand-written facts live in docs/map/curated.json; docs/map/generate.py checks them against the source tree, adds what it can read from the code, and writes foliage-map.json, index.html and docs/VERSION-MAP.md from them. Edit curated.json, never the generated files.", "versions": ["1.20.1", "1.21.1", "1.21.11", "26.1.2", "26.2", "26.3"], "loadersByVersion": {"1.20.1": ["fabric", "forge"], "1.21.1": ["fabric", "neoforge"], "1.21.11": ["fabric", "neoforge"], "26.1.2": ["fabric", "neoforge"], "26.2": ["fabric", "neoforge"], "26.3": ["fabric", "neoforge"]}, "rangeSyntax": "A node's 'versions' is a list of Stonecutter-style bounds that must all hold, e.g. \">=1.21.11 <26.3\"; empty means every version. 'loaders' limits it to those loaders; absent means all."}, "groups": [{"id": "core", "label": "GPU renderer", "about": "Meshes the foliage near the player on its own and draws it with the sway on the GPU."}, {"id": "split", "label": "Mesh split & handover", "about": "Takes the near foliage out of the chunk mesh, and hands it back and forth without a frame of double or missing plants."}, {"id": "motion", "label": "Motion", "about": "What moves the plants: Sway's pushes, the calm sway, the rain wind and its shelter."}, {"id": "shaders", "label": "Shaders", "about": "The mod's own shader sets, one per generation of Minecraft's shading language, all sharing sway.glsl."}, {"id": "terrain", "label": "Terrain look", "about": "Drawing the foliage with the shaders the chunks are drawn with, so it matches vanilla, Sodium and resource packs."}, {"id": "sodium", "label": "Sodium & kin", "about": "Sodium, Embeddium and Indium: who meshes and draws the chunks when they are installed."}, {"id": "iris", "label": "Shader packs", "about": "Iris and Oculus: the foliage drawn through a shader pack's own programs, swaying, into its shadow map too."}, {"id": "polytone", "label": "Polytone", "about": "The foliage in Polytone's shadow map."}, {"id": "snowrealmagic", "label": "Snow! Real Magic", "about": "Plants held inside Snow! Real Magic's snow: pushed by Sway, bent, drawn snowy on the CPU and the GPU, shaking snow off when touched."}, {"id": "loader", "label": "Loaders", "about": "Where the mod meets Fabric, NeoForge and Forge."}, {"id": "build", "label": "Build & dev", "about": "Stonecutter, build-logic, access wideners, mixin configs and the dev-run traps."}, {"id": "external", "label": "Other mods", "about": "Mods the renderer depends on or works with."}, {"id": "version", "label": "Versions", "about": "The Minecraft versions the mod is built for."}], "nodes": [{"id": "renderer", "label": "GpuFoliageRenderer", "group": "core", "kind": "component", "files": ["gpu/GpuFoliageRenderer.java"], "summary": "The GPU renderer. Meshes every section near the player that holds foliage, packs sections into 8x4x8 regions (Sodium's grouping) and draws each region's visible runs in as few calls as it can.", "details": ["Geometry comes from ModelBlockRenderer.tesselateBlock, the method the section compiler uses, so AO, light and biome tint are vanilla's.", "Each vertex carries two extra values after the block format: SwayCell (which plant, for its push) and SwayWeights (one float, 24 exact bits: the wind weight 10, the push 8, a still-in-calm flag 1, a steady flag 1, the wind exposure 4 -- for a block hanging on leaves, three of those and one bit for whether the leaves wave at its corner; packWeights, unpacked in sway.glsl and both legacy vsh).", "Rebuilds have a budget per frame on every version: the six queued sections nearest the camera, for 4 ms after the first. The near area's radius follows the render distance.", "Only near the player: further out the chunk mesh keeps the foliage, still.", "At most one region is uploaded a frame, on every version (uploadDueRegion): the nearest to the camera among those with nothing left queued for them or waiting past 500 ms; one waiting past 2 s goes first. A region is drawn as last uploaded meanwhile (Region.uploadedSections), so its buffer and its layout always agree. Uploading every dirty region whole each frame, as 1.21.11+ did, was the stutter waving leaves showed.", "A section holds its cutout vertices and then its solid ones (Section.opaqueVertexCount: leaves drawn as the game's Fast leaves are, meshed in a second walk); a region's buffer holds every section's cutout part and then every solid part, so each kind still goes out in long runs, and the solid runs are drawn first with a pipeline that keeps every pixel.", "Three draw paths by version: drawLegacy (<1.21.11), a pass of its own (1.21.11-26.2), prepare/draw split into vanilla's pass (26.3+)."], "pitfalls": ["It is one 4200-line file guarded per version; read the branch for the version you work on, not the first one you find."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 4072, "guard": "//? >=1.20.1 {"}}}, {"id": "draw-legacy", "label": "Legacy draw", "group": "core", "kind": "path", "versions": ["<1.21.11"], "files": ["gpu/GpuFoliageRenderer.java"], "summary": "Before 1.21.11: a ShaderInstance loaded from JSON and VertexBuffers per region, drawn right away from the loader's render event.", "details": ["Shader registered through CoreShaderRegistrationCallback (Fabric) or RegisterShadersEvent (NeoForge/Forge).", "The frame hook hands over camera, frustum, model view and projection (legacy draw(Vec3, Frustum, Matrix4f, Matrix4f))."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 4072, "guard": "//? >=1.20.1 {"}}}, {"id": "draw-pass", "label": "Own render pass", "group": "core", "kind": "path", "versions": [">=1.21.11", "<26.3"], "files": ["gpu/GpuFoliageRenderer.java"], "summary": "1.21.11 to 26.2: RenderPipelines, compiled by the game, drawn in a render pass the mod opens itself right after the opaque terrain.", "details": ["draw(LevelRenderState) from the loader's opaque-terrain event; submitDraws writes the region transforms and draws.", "From 26.2 depth is reversed, and uniforms are bind group layouts."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 4072, "guard": "//? >=1.20.1 {"}}}, {"id": "draw-split", "label": "Prepare / draw split", "group": "core", "kind": "path", "versions": [">=26.3"], "files": ["gpu/GpuFoliageRenderer.java", "mixin/LevelPassMixin.java"], "summary": "26.3+: the opaque world is drawn inside one pass vanilla opens (Main/Solid), where nothing may be written. So the frame is prepared as the level's extraction ends, the view is written at LevelRenderer.render HEAD, and only bind+draw happens inside vanilla's pass.", "details": ["Prepare: draw(LevelRenderState) at Fabric END_EXTRACTION / NeoForge ExtractLevelRenderStateEvent: collects draws, compiles pipelines, writes sway/push buffers, requests the shared index count.", "writeLevelUniforms at LevelRenderer.render HEAD: region transforms or the terrain's block, with the final view (Iris moves bobbing into it just before).", "drawIntoLevelPass from LevelPassMixin in executeSolid, before the solid features.", "closeBuffers discards what was prepared: a pack switch reloads everything between prepare and draw."], "pitfalls": ["With a pass open, createRenderPass, writeToBuffer, copies and clears throw; mapped DynamicGpuData writes are fine.", "Never ask for a compiled pipeline inside the pass: PipelineCache.get compiles on demand, and does not remember failures (compiledPipeline remembers them per shader reload).", "Every uniform a pipeline declares must be bound before a draw, or setupDraw dies on a null buffer.", "The shared index buffer may only grow outside a pass: requestIndexCount while preparing, getBuffer() in the pass.", "Do not use DynamicGpuData.writeChunkSections: it shares storage with the MDI vertex buffer. Each region keeps its own ChunkSection UBO."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 4072, "guard": "//? >=1.20.1 {"}, "mixin/LevelPassMixin.java": {"kind": "java", "lines": 50, "guard": "//? >=26.3 {"}}}, {"id": "near-area", "label": "Near area & regions", "group": "core", "kind": "component", "files": ["gpu/GpuFoliageRenderer.java"], "summary": "Which sections the GPU owns: within an adaptive radius of the player, rebuilt nearest first. Regions out of range are freed before anything is drawn.", "details": ["Chunk load/unload come from the loader's chunk events (Sodium overwrites vanilla's dirty-marking routes).", "Light changes and allChanged come through LevelExtractorMixin; block changes through ClientLevelMixin."], "fileInfo": {"gpu/GpuFoliageRenderer.java": {"kind": "java", "lines": 4072, "guard": "//? >=1.20.1 {"}}}, {"id": "split", "label": "GpuFoliageSplit", "group": "split", "kind": "component", "files": ["gpu/GpuFoliageSplit.java"], "summary": "Decides who draws each plant. Every foliage model is wrapped by a loader-specific model; while a chunk mesher asks it for a block near the player (leaveToGpu), it hands back nothing.", "details": ["A block is foliage when Sway says it is interactive (SwayAPI.isInteractive).", "Meshers hand the model the position: Fabric's rendering API, NeoForge's model extensions, Forge's model data. Vanilla, Sodium 0.6+ and Embeddium all go through them.", "Sodium's LevelSlice (WorldSlice before 0.6) is how a Sodium build is recognised."], "fileInfo": {"gpu/GpuFoliageSplit.java": {"kind": "java", "lines": 641, "guard": "//? >=1.20.1 {"}}}, {"id": "model-fabric", "label": "GpuFoliageModel (FRAPI)", "group": "split", "kind": "hook", "loaders": ["fabric"], "files": ["gpu/GpuFoliageModel.java", "platform/fabric/FabricFoliageHooks.java"], "summary": "Fabric: wraps foliage models with ModelLoadingPlugin, outside Sway's wrapper, and withholds quads in emitQuads.", "details": ["modifyModelAfterBake before 1.21.11 (block read from the model id), modifyBlockModelAfterBake from 1.21.11 (the state is handed over)."], "fileInfo": {"gpu/GpuFoliageModel.java": {"kind": "java", "lines": 93, "guard": "//? fabric {"}, "platform/fabric/FabricFoliageHooks.java": {"kind": "java", "lines": 115, "guard": "//? fabric {"}}}, {"id": "model-neoforge", "label": "NeoforgeFoliageModel", "group": "split", "kind": "hook", "loaders": ["neoforge"], "files": ["platform/neoforge/NeoforgeFoliageModel.java", "platform/neoforge/NeoforgeFoliageHooks.java"], "summary": "NeoForge: wraps inside Sway's wrapper at ModelEvent.ModifyBakingResult. 1.21.1: BakedModelWrapper deciding in getModelData. 1.21.11+: answers the collectParts(level, pos, state, random, parts) extension.", "details": ["Sodium on NeoForge asks through collectParts too (NeoForgeModelAccess.collectPartsOf) with its LevelSlice."], "fileInfo": {"platform/neoforge/NeoforgeFoliageModel.java": {"kind": "java", "lines": 217, "guard": "//? neoforge && >=1.21.1 {"}, "platform/neoforge/NeoforgeFoliageHooks.java": {"kind": "java", "lines": 258, "guard": "//? neoforge && >=1.21.1 {"}}}, {"id": "model-forge", "label": "ForgeFoliageModel", "group": "split", "kind": "hook", "loaders": ["forge"], "versions": ["<1.21.1"], "files": ["platform/forge/ForgeFoliageModel.java", "platform/forge/ForgeFoliageHooks.java"], "summary": "Forge 1.20.1: decides in getModelData (vanilla and Embeddium call it for every block) and carries the answer in model data to getQuads. Sits outside Sway's wrapper.", "details": ["Embeddium hands getModelData a generated WorldSliceLocal, not WorldSlice."], "fileInfo": {"platform/forge/ForgeFoliageModel.java": {"kind": "java", "lines": 115, "guard": "//? forge {"}, "platform/forge/ForgeFoliageHooks.java": {"kind": "java", "lines": 186, "guard": "//? forge {"}}}, {"id": "handover", "label": "Mesh swap handover", "group": "split", "kind": "hook", "files": ["mixin/SectionMeshSwapMixin.java", "gpu/GpuFoliageSplit.java"], "summary": "The GPU takes or gives back a section only once the chunk mesh that matches it is on screen, so plants never vanish or double for a frame.", "details": ["Vanilla: LevelRenderer.addRecentlyCompiledChunk (1.20.1), RenderSection.setCompiled (1.21.1), setSectionMesh (1.21.11+).", "Empty builds finish on a worker thread (before 1.21.11 and from 26.1.2): reported through onChunkMeshSwappedElsewhere.", "Sodium: see Sodium upload hook.", "A whitelist group switched on (the leaves): in a section the renderer already draws, the chunk mesh keeps the group's blocks (GpuFoliageSplit.AWAITING_GROUP, read by isFoliageAt) until the renderer has uploaded a mesh built with the new list (Section.listGeneration), and is only then asked to let go. The leaves are drawn twice for the few frames that chunk build takes: accepted, rather than drawn by nobody for as long as the renderer takes to mesh and upload every section. Switched off, the chunk mesh goes first and the renderer follows on the MeshSwap."], "fileInfo": {"mixin/SectionMeshSwapMixin.java": {"kind": "java", "lines": 84, "guard": "//? >=1.20.1 {"}, "gpu/GpuFoliageSplit.java": {"kind": "java", "lines": 641, "guard": "//? >=1.20.1 {"}}}, {"id": "dirty", "label": "Change tracking", "group": "split", "kind": "hook", "files": ["mixin/ClientLevelMixin.java", "mixin/LevelExtractorMixin.java"], "summary": "Keeps the mod's meshes in step: block changes (ClientLevel.setBlocksDirty), light changes (setSectionDirty), and allChanged (resource reload, world swap, video options).", "details": ["The class that marks sections dirty is LevelRenderer before 26.2 and LevelExtractor from 26.2.", "1.21.11-26.1: also catches the cull frustum at prepareCullFrustum (from 26.1.2 the camera state carries it)."], "fileInfo": {"mixin/ClientLevelMixin.java": {"kind": "java", "lines": 36, "guard": "//? >=1.20.1 {"}, "mixin/LevelExtractorMixin.java": {"kind": "java", "lines": 63, "guard": "//? >=1.20.1 {"}}}, {"id": "sway-api", "label": "Sway", "group": "external", "kind": "mod", "summary": "Required. Decides which blocks are interactive, how they are pushed (BehaviorPipeline, contributors), and deforms them itself in CPU mode.", "details": ["Modrinth ids per version are in stonecutter.properties.toml (deps.sway).", "Fabric: deforms in FRAPI emitBlockQuads. NeoForge/Forge: deforms in the model, the mod's wrapper sits inside it (NeoForge) or outside it (Forge)."], "pitfalls": ["Never modify Sway and do not contact its author (user's rule)."], "fileInfo": {}}, {"id": "interaction", "label": "GpuFoliageInteraction", "group": "motion", "kind": "component", "files": ["gpu/GpuFoliageInteraction.java"], "summary": "Sway's push for each plant, followed through a damped spring and sent to the shader as a uniform block (up to 128 cells), keyed by the plant's anchor block.", "details": ["upload() also steps the springs: call it once per frame. A second draw in the same frame (shadow map) reuses uploaded()."], "fileInfo": {"gpu/GpuFoliageInteraction.java": {"kind": "java", "lines": 394, "guard": "//? >=1.20.1 {"}}}, {"id": "proximity", "label": "SwayProximityForceMixin", "group": "motion", "kind": "hook", "files": ["mixin/SwayProximityForceMixin.java"], "summary": "While the GPU draws, entities push plants from a little further and a little harder than Sway alone, only as Sway reads it.", "fileInfo": {"mixin/SwayProximityForceMixin.java": {"kind": "java", "lines": 40, "guard": "//? >=1.20.1 {"}}}, {"id": "wind", "label": "Rain wind & shelter", "group": "motion", "kind": "component", "files": ["gpu/WindShelter.java"], "summary": "Rain replaces the calm sway with a west wind with gusts (sway.glsl). WindShelter bakes each plant's exposure (roofs, upwind walls) into 4 bits of SwayWeights while meshing.", "details": ["Weather reaches the shader in the FoliageSway block (>=1.21.11) or as a loose uniform (legacy).", "Tuning constants live in sway.glsl (MC2_WIND_LEAN etc.)."], "fileInfo": {"gpu/WindShelter.java": {"kind": "java", "lines": 412, "guard": "//? >=1.20.1 {"}}}, {"id": "settings", "label": "Settings & screen", "group": "motion", "kind": "component", "files": ["FoliageSettings.java", "FoliageConfigScreen.java", "platform/fabric/FabricModMenuIntegration.java", "platform/fabric/FoliageKeyBindings.java", "platform/neoforge/NeoforgeKeyBindings.java", "platform/forge/ForgeKeyBindings.java"], "summary": "The mod's own config file next to Sway's, the two-column screen with presets, renderer (CPU/GPU), waving, weather wind and distance.", "pitfalls": ["User-facing text goes through translation keys (the user translates). Update widgets in place, never rebuild the screen."], "fileInfo": {"FoliageSettings.java": {"kind": "java", "lines": 333, "guard": ""}, "FoliageConfigScreen.java": {"kind": "java", "lines": 754, "guard": "//? >=1.20.1 {"}, "platform/fabric/FabricModMenuIntegration.java": {"kind": "java", "lines": 28, "guard": "//? fabric {"}, "platform/fabric/FoliageKeyBindings.java": {"kind": "java", "lines": 89, "guard": "//? fabric {"}, "platform/neoforge/NeoforgeKeyBindings.java": {"kind": "java", "lines": 94, "guard": "//? neoforge {"}, "platform/forge/ForgeKeyBindings.java": {"kind": "java", "lines": 63, "guard": "//? forge {"}}}, {"id": "modcompat", "label": "ModCompatRegistry", "group": "motion", "kind": "component", "files": ["ModCompatRegistry.java"], "summary": "Registers third-party mods' plants with Sway (by id, skipped when the mod is absent), which also makes them GPU foliage.", "fileInfo": {"ModCompatRegistry.java": {"kind": "java", "lines": 403, "guard": ""}}}, {"id": "sway-removals", "label": "SwayRemovals", "group": "motion", "kind": "component", "files": ["SwayRemovals.java"], "summary": "Provisional: blocks Sway registers that it should not (moss carpet, glow lichen, spore blossom, chorus, big dripleaf), taken back out through Sway's public API (getRegistry().remove + an empty pipeline) right after ModCompatRegistry, before models bake. They stay plain vanilla in both renderers, so the GPU leaves them to the chunk. Goes once a Sway release drops them.", "details": ["Replaced the waving blacklist, whose blocks were all of this kind. SwayWeights' still flag stays, now set only for blocks that follow the leaves."], "fileInfo": {"SwayRemovals.java": {"kind": "java", "lines": 82, "guard": "//? >=1.21.11 {"}}}, {"id": "waving-whitelist", "label": "WavingWhitelist", "group": "motion", "kind": "component", "files": ["WavingWhitelist.java"], "summary": "Blocks Sway does not bend that the GPU renderer still draws and waves, by group (vanilla and mods together): GENERAL (petals, wildflowers; always on, 2x a plant) and LEAVES (#minecraft:leaves; 0.20, waved as a field so touching leaves never part; the player's Waving Leaves checkbox). A follow-the-leaves list (vines) waves with the leaves only while they wave.", "details": ["Tags are read at bake time from every jar's data/<ns>/tags/block files (Platform.readAll; NeoForge 26.3 through ModList), since the world's tags arrive after the models are baked.", "GpuFoliageSplit.mayWave wraps listed blocks at bake whatever their group's state; waves/isFoliage decide at mesh time, so the checkbox only rebuilds the GPU area's sections (GpuFoliageRenderer.foliageListChanged, remesh on the MeshSwap).", "Field wave: constant weight, edge and rain fade measured at the vertex (SwayWeights' steady flag, which also keeps pushes from calming the sway). Rain's reach is worked out per corner (WindShelter.cornerExposure: the 8 blocks around it, leaves neither walls nor roofs to one another, no sky light), the same for every block sharing the corner, so sheltered leaves calm without cracks.", "A field's corner touching a block that holds the leaves still does not wave (SwayAnchor.pinAt, from the 8 blocks around the corner alone, so every block sharing it agrees; every version, Fancy and Fast): a full block that is not leaves -- a trunk, the ground -- or a layer of the resting kind lying on anything but a leaf (holdsLeavesStill). Leaves never sink into a trunk nor part from it. Since every corner of a face against such a block stands still, leaves touching only air, leaves and such blocks are meshed with the culling renderer, exactly as the section compiler culls; only against a block they part from (a fence, stairs, a slab) is every face kept (partsFromNeighbour; a second ModelBlockRenderer built with cull off).", "Followers (vines): a majority vote of what is behind each block decides; leaves win -> the whole vine moves with the leaves' field and its free-hanging part below the lowest held block gets a plant's sway at 1.0 (still+steady flags; the leaves' weight is the shaders' MC2_LEAVES_WAVE constant, which must match Group.LEAVES; three exposure bits carry the corner's wind reach, the same the leaves beside it read, and the fourth whether the leaves wave at that corner or are held still (SwayAnchor.leafHeldAt), so the strand moves exactly as the leaf beside it); strands of 1-2 blocks get the field only; otherwise, or with waving leaves off, interaction only, and a vine that clings mostly to anything else is not pushed either (SwayAnchor.pushless).", "Only a block solid on that side counts as behind a strand, by the test the rain's wind uses for walls (WindShelter.isSolidSide): a torch, fence, slab or another vine is as good as nothing.", "The leaves group waves with the game's see-through leaves, and with its Fast leaves where the renderer can draw them solid too (WavingWhitelist.leavesWave / opaqueLeaves; GpuFoliageRenderer.canDrawOpaqueLeaves: 26.3; from 1.21.11 to 26.2 with the terrain's shaders and the mod's own, and on 1.21.11 with Sodium 0.8's too). There every LeavesBlock, as vanilla's forceOpaque picks them, is meshed last and drawn with a copy of the pipeline without ALPHA_CUTOUT, the way vanilla's solid terrain differs from its cutout terrain: OPAQUE_PIPELINE, TERRAIN_OPAQUE_PIPELINE, SODIUM_OPAQUE_PIPELINE (Sodium's solid material, 1u), and through a shader pack the mod's copies of its TerrainSolid and ShadowSolid programs in a pipeline assigned to Iris's TERRAIN_SOLID. Faces between leaves are hidden by LeavesBlock.skipRendering, as in the chunk mesh. Elsewhere Fast leaves are left to the game and the checkbox greys out with a tooltip. Which leaves the game draws is read once a frame: cutoutLeaves from 1.21.11; before, Sodium's or Embeddium's own leaves quality, by reflection, else useFancyGraphics.", "Snow! Real Magic on Forge 1.20.1 draws the snow around its plants with minecraft:snow's model -- wrapped for snow on leaves -- and the plant's model data: ForgeFoliageModel never applies its plant-in-snow logic to a resting block's state, or the snow there vanished.", "Blocks resting on the leaves (restOnLeaves: minecraft:snow, the two moss carpets, and every block of vanilla's #wool_carpets tag, which mods' carpets join) are foliage only where they lie on a leaf while the leaves wave (GpuFoliageSplit.isFoliageAt / restsOnWavingLeaves, a position rule the model wrappers and the mesher ask): meshed as a field at the leaves' weight, every vertex reading the corner of the leaf's top under it whatever its own height (SwayAnchor.restY), so the whole layer moves as that leaf.", "Any other plant Sway hangs (pale hanging moss, cave vines, BOP's mosses...) follows the leaves the same way while it literally hangs from them (the block above its top), and is a plain plant otherwise."], "pitfalls": ["Before 26.3 Fast leaves are still left to the game through a shader pack, with Sodium 0.9 (26.1.2, 26.2), and before 1.21.11. A shader pack that discards by the texture's alpha in its own shadow shader (Miniature) gives Fast leaves holed shadows, the game's own included; one that leaves it to Iris's alpha test (BSL) does not."], "fileInfo": {"WavingWhitelist.java": {"kind": "java", "lines": 444, "guard": "//? >=1.21.11 {"}}}, {"id": "sway-glsl", "label": "sway.glsl", "group": "shaders", "kind": "shader", "files": ["shaders/include/sway.glsl"], "summary": "The one place the motion is written: calm sway, pushes, rain wind. Spliced into every shader the foliage is drawn with: the mod's, the terrain's, Sodium's and a shader pack's.", "fileInfo": {"shaders/include/sway.glsl": {"kind": "shader", "lines": 223, "guard": ""}}}, {"id": "sh-legacy", "label": "foliage_legacy*", "group": "shaders", "kind": "shader", "versions": ["<1.21.11"], "files": ["shaders/core/foliage_legacy.json", "shaders/core/foliage_legacy.vsh", "shaders/core/foliage_legacy.fsh", "shaders/core/foliage_legacy_1_20.json", "shaders/core/foliage_legacy_1_20.vsh"], "summary": "JSON ShaderInstance set. 1.21.1: foliage_legacy. 1.20.1: foliage_legacy_1_20 (own vsh with an attributes list; fog measured from the view), sharing the legacy fsh.", "fileInfo": {"shaders/core/foliage_legacy.json": {"kind": "shader", "lines": 26, "guard": ""}, "shaders/core/foliage_legacy.vsh": {"kind": "shader", "lines": 190, "guard": ""}, "shaders/core/foliage_legacy.fsh": {"kind": "shader", "lines": 27, "guard": ""}, "shaders/core/foliage_legacy_1_20.json": {"kind": "shader", "lines": 32, "guard": ""}, "shaders/core/foliage_legacy_1_20.vsh": {"kind": "shader", "lines": 189, "guard": ""}}}, {"id": "sh-pipeline", "label": "foliage.vsh/.fsh", "group": "shaders", "kind": "shader", "versions": [">=1.21.11", "<26.3"], "files": ["shaders/core/foliage.vsh", "shaders/core/foliage.fsh", "shaders/core/foliage_terrain.vsh"], "summary": "RenderPipeline-era set (1.21.11-26.2). foliage_terrain.vsh is the placeholder name whose source TerrainFoliageShader builds.", "fileInfo": {"shaders/core/foliage.vsh": {"kind": "shader", "lines": 68, "guard": ""}, "shaders/core/foliage.fsh": {"kind": "shader", "lines": 26, "guard": ""}, "shaders/core/foliage_terrain.vsh": {"kind": "shader", "lines": 27, "guard": ""}}}, {"id": "sh-modern", "label": "foliage_modern", "group": "shaders", "kind": "shader", "versions": [">=26.3"], "files": ["shaders/core/foliage_modern.vsh", "shaders/core/foliage_modern.fsh", "shaders/include 3: one compiled pipeline per variant asked for (cut out, and solid for Fast leaves), built from the one spliced source and closed together when the shaders reload."], "fileInfo": {"gpu/TerrainFoliageShader.java": {"kind": "java", "lines": 276, "guard": "//? >=1.21.11 {"}}}, {"id": "legacy-terrain", "label": "LegacyTerrainShader", "group": "terrain", "kind": "component", "versions": ["<1.21.11"], "files": ["gpu/LegacyTerrainShader.java"], "summary": "1.20.1-1.21.1: builds a ShaderInstance from the cutout layer's JSON (rendertype_cutout, following the names the JSON gives), with the sway spliced into its vertex shader.", "pitfalls": ["Skipped while Sodium draws the chunks: no core-shader support mod reaches Sodium there."], "fileInfo": {"gpu/LegacyTerrainShader.java": {"kind": "java", "lines": 257, "guard": "//? >=1.20.1 && <1.21.11 {"}}}, {"id": "terrain-slabs", "label": "Terrain Slabs", "group": "terrain", "kind": "compat", "files": ["gpu/TerrainSlabsCompat.java"], "summary": "Lowers plants on bottom slabs half a block, as Terrain Slabs does in its FRAPI wrapper, by the same rule (its OnTopHelper, found by MethodHandle). Soft: no mixin, missing or changed mod only logs a warning.", "details": ["No Terrain Slabs for 26.3 yet; expected to work unchanged if its helper keeps its name."], "fileInfo": {"gpu/TerrainSlabsCompat.java": {"kind": "java", "lines": 71, "guard": ""}}}, {"id": "sodium-bridge", "label": "SodiumBridge", "group": "sodium", "kind": "component", "files": ["gpu/SodiumBridge.java"], "summary": "Everything the renderer asks of Sodium, by reflection (Sodium is never on the compile classpath for this): whether it draws the chunks, whether meshes can be split, rebuild requests, visibility, and upload results.", "details": ["Package me.jellysquid before Sodium 0.6 (1.20.1), net.caffeinemc after.", "Forge 1.20.1: Embeddium, same Sodium 0.5 classes, mod ids embeddium/rubidium."], "fileInfo": {"gpu/SodiumBridge.java": {"kind": "java", "lines": 251, "guard": "//? >=1.20.1 {"}}}, {"id": "sodium-upload", "label": "Sodium upload hook", "group": "sodium", "kind": "hook", "files": ["mixin/SodiumMeshSwapMixin.java"], "summary": "@Pseudo mixin on RenderRegionManager: where Sodium puts a finished build in place. The public overload is named with its descriptor (a private one of the same name reports each section twice).", "details": ["0.5 (1.20.1): uploadMeshes(CommandList, Collection)", "0.8 (1.21.1, 1.21.11): uploadResults(CommandList, Collection)", "0.9.2 on 26.1.2: uploadResults(CommandList, Collection, UniformBufferManager)", "0.9 on 26.2/26.3: uploadResults(Collection, UniformBufferManager)", "BuilderTaskOutput's section field: render (0.8), section (0.9)."], "fileInfo": {"mixin/SodiumMeshSwapMixin.java": {"kind": "java", "lines": 64, "guard": "//? >=1.20.1 {"}}}, {"id": "sodium-shader", "label": "SodiumFoliageShader", "group": "sodium", "kind": "component", "versions": [">=1.21.11"], "files": ["gpu/SodiumFoliageShader.java"], "summary": "Draws foliage with a copy of Sodium's own chunk shaders (sodium:blocks/block_layer_opaque, or a pack's), adapted to the mod's vertices and uniforms.", "details": ["1.21.11 (0.8): sources from ShaderLoader, #import expanded; packs need Sodium Core Shader Support.", "26.1.2: hybrid: 0.8 loading, 0.9 content.", "26.2+: vanilla ShaderManager, #moj_import / #include; u_SectionTimeInfo replaced, push_constant blocks stripped (VULKAN defined).", "26.3: #include IMPORT pattern, BuiltSource, compiled via compilePipeline(...).finishCompile(), cached per SOLID_TERRAIN identity; one copy per variant, the solid one without ALPHA_CUTOUT and with Sodium's solid material.", "1.21.11 (Sodium 0.8): one pair of shaders for every pass; the solid pass is compiled without USE_FRAGMENT_DISCARD and its vertices carry the solid material (1u, cutoff 0), so the solid copy drops that define, and names RENDER_PASS_SOLID in place of RENDER_PASS_CUTOUT for Sodium Core Shader Support's packs. The game keeps compiled shaders by name before 26.3, so the solid copy has a name of its own (SHADER_OPAQUE) for SODIUM_OPAQUE_PIPELINE; where it does not compile the leaves are drawn cut out."], "fileInfo": {"gpu/SodiumFoliageShader.java": {"kind": "java", "lines": 624, "guard": "//? >=1.21.11 {"}}}, {"id": "indium", "label": "Indium", "group": "external", "kind": "mod", "loaders": ["fabric"], "versions": ["<1.21.1"], "summary": "Fabric 1.20.1 with Sodium 0.5 needs Indium for FRAPI: without it neither Sway nor the mod's model run under Sodium, and the GPU mode stays off with a warning. Publish-only required dependency.", "fileInfo": {}}, {"id": "embeddium", "label": "Embeddium", "group": "external", "kind": "mod", "loaders": ["forge"], "versions": ["<1.21.1"], "summary": "Forge 1.20.1's Sodium port (Sodium 0.5 classes). The renderer button is greyed out on GPU with it; far foliage stays still (accepted).", "fileInfo": {}}, {"id": "sodium", "label": "Sodium", "group": "external", "kind": "mod", "summary": "Owns chunk meshing and drawing when installed. Versions: 0.5 (1.20.1), 0.8 (1.21.1, 1.21.11), 0.9.2 (26.1.2+).", "details": ["NeoForge's jar carries the mod as a jar-in-jar; on 26.3 its classes and shaders are byte-identical to Fabric's except three of its own mixins.", "Its terrain setup runs inside LevelExtractor.extract (at consumeFrustumUpdate) on 26.3, before the end-of-extraction events."], "fileInfo": {}}, {"id": "iris-compat", "label": "IrisCompat", "group": "iris", "kind": "component", "files": ["gpu/IrisCompat.java"], "summary": "The gate: answers the renderer's shader pack questions without loading Iris classes when Iris is absent. Where the support is not compiled (nowhere at present), an installed Iris counts as a pack always loaded with no programs, so the chunk mesh keeps the foliage.", "fileInfo": {"gpu/IrisCompat.java": {"kind": "java", "lines": 224, "guard": "//? >=1.20.1 {"}}}, {"id": "iris-shaders", "label": "IrisFoliageShaders", "group": "iris", "kind": "component", "files": ["gpu/IrisFoliageShaders.java", "mixin/iris/IrisRenderingPipelineAccessor.java", "mixin/iris/ShaderCreatorMixin.java", "mixin/iris/IrisMixinPlugin.java"], "summary": "Per pack, builds copies of the pack's programs (terrain cutout, shadow cutout; on 26.3 also solid terrain and solid shadow, for Fast leaves) through Iris's own createShader/createShadowShader, with sway.glsl spliced into the translated vertex shader (iris_Position replaced).", "details": ["ShaderCreatorMixin redirects TransformPatcher.patchVanilla only while building (26.3 adds a Set<String> textureOverrides parameter).", "Meshes with the block ids the pack expects (BlockSensitiveBufferBuilder.beginBlock) in Iris's terrain format plus the two sway values.", "A new pack or none: deactivate and re-mesh."], "pitfalls": ["IrisMixinPlugin.getMixins must return nothing without Iris: Mixin never asks shouldApplyMixin for companion mixins (a laptop without Iris crashed on this)."], "fileInfo": {"gpu/IrisFoliageShaders.java": {"kind": "java", "lines": 755, "guard": "//? iris {"}, "mixin/iris/IrisRenderingPipelineAccessor.java": {"kind": "java", "lines": 91, "guard": "//? iris {"}, "mixin/iris/ShaderCreatorMixin.java": {"kind": "java", "lines": 73, "guard": "//? iris {"}, "mixin/iris/IrisMixinPlugin.java": {"kind": "java", "lines": 85, "guard": "//? iris {"}}}, {"id": "iris-inject", "label": "Pack program injection", "group": "iris", "kind": "hook", "files": ["mixin/iris/GlDeviceMixin.java", "mixin/iris/ExtendedShaderMixin.java"], "summary": "How the copy reaches the draw. <1.21.11: the ShaderInstance is used directly. 1.21.11-26.2: GlDeviceMixin returns a GlRenderPipeline around the copy; ExtendedShaderMixin adds the sway blocks. 26.3: IrisApi.assignPipeline + withFoliageProgram swaps the copy into Iris's own pipeline.", "details": ["1.21.1: Iris returns ShaderInstance (ExtendedShader, iris_-prefixed uniforms), sway uniforms set by raw GL, push block bound at index 12; Iris closes those programs itself.", "26.3: Iris binds blocks only by known names (0-6), so the sway blocks go to the top two GL_MAX_UNIFORM_BUFFER_BINDINGS points, bound with glBindBufferBase before the draws (never hard-code points).", "26.3: wrappers share one program; close their VertexArrays and the program once."], "fileInfo": {"mixin/iris/GlDeviceMixin.java": {"kind": "java", "lines": 34, "guard": "//? >=1.21.11 && iris && <26.3 {"}, "mixin/iris/ExtendedShaderMixin.java": {"kind": "java", "lines": 43, "guard": "//? >=1.21.11 && iris && <26.3 {"}}}, {"id": "iris-shadow", "label": "Pack shadow map", "group": "iris", "kind": "hook", "files": ["mixin/iris/ShadowRendererMixin.java", "gpu/IrisFoliageShaders.java"], "summary": "Plants cast swaying shadows. <26.1.2: ShadowRendererMixin at the point a callback would be. 26.1.2+: IrisApi.registerShadowRenderCallback. 26.3: plus assignPipelineShadow and drawIntoShadowMap in a pass of the mod's own.", "details": ["26.2: a pre-flipped depth pipeline (Iris only flips depth for pipelines it knows).", "26.3: Iris flips depth and disables cull for every pipeline in the shadow pass; the callback runs with no pass open, before addMainPass; fog must be bound by hand. Solid leaves are drawn there with the solid shadow copy."], "fileInfo": {"mixin/iris/ShadowRendererMixin.java": {"kind": "java", "lines": 36, "guard": "//? iris && <26.1.2 {"}, "gpu/IrisFoliageShaders.java": {"kind": "java", "lines": 755, "guard": "//? iris {"}}}, {"id": "iris-vertex", "label": "IrisVertexExtension", "group": "iris", "kind": "component", "files": ["gpu/IrisVertexExtension.java"], "summary": "Keeps Iris from widening the mod's BLOCK-format meshing buffer when the mod meshes for its own pipeline (ImmediateState.skipExtension), and lets it while the mod meshes for a pack, raising ImmediateState.isRenderingLevel itself meanwhile: Iris widens only under it, and from 1.11.7 no longer holds it while a frame is extracted, which is when 26.3 meshes. 1.20.1's Iris/Oculus has no such switch.", "fileInfo": {"gpu/IrisVertexExtension.java": {"kind": "java", "lines": 123, "guard": "//? >=1.20.1 {"}}}, {"id": "iris", "label": "Iris", "group": "external", "kind": "mod", "summary": "Fabric on every version; NeoForge from 1.21.1 (26.3 from Iris 1.11.7, whose classes shared with Fabric's are byte for byte the same). OpenGL only.", "details": ["Debug: enableDebugOptions=true in run/config/iris.properties dumps translated programs to run/patched_shaders."], "fileInfo": {}}, {"id": "oculus", "label": "Oculus", "group": "external", "kind": "mod", "loaders": ["forge"], "versions": ["<1.21.1"], "summary": "Iris on Forge 1.20.1, mod id oculus (Forge ignores the iris id it provides). Same code as Iris 1.7.", "fileInfo": {}}, {"id": "polytone-shadow", "label": "ShadowMapRendererMixin", "group": "polytone", "kind": "hook", "versions": [">=1.21.1", "<26.3"], "files": ["mixin/polytone/ShadowMapRendererMixin.java", "mixin/polytone/PolytoneMixinPlugin.java"], "summary": "Draws the GPU foliage into Polytone's shadow map once its terrain is in it, before the entities. Targets by name, not compiled against Polytone; the method is render or renderShadowMap depending on the release.", "details": ["Config is required:false and gated by PolytoneMixinPlugin; excluded from the jar on 1.20.1 and 26.3."], "fileInfo": {"mixin/polytone/ShadowMapRendererMixin.java": {"kind": "java", "lines": 50, "guard": "//? >=1.21.1 && <26.3 {"}, "mixin/polytone/PolytoneMixinPlugin.java": {"kind": "java", "lines": 60, "guard": "//? >=1.21.1 {"}}}, {"id": "polytone", "label": "Polytone", "group": "external", "kind": "mod", "versions": [">=1.21.1"], "summary": "Has a shadow map from 1.21.1 (not 1.20.1). No Polytone for 26.3 yet.", "fileInfo": {}}, {"id": "srm", "label": "Snow! Real Magic", "group": "external", "kind": "mod", "summary": "Lets snow settle on plants: the plant's block becomes one of its snow blocks, which keeps the plant in its block entity (SnowBlockEntity.getContainedState) and draws it through the plant's own model, at the same position, before the snow. Grass, ferns, tall grass, large ferns and berry bushes get a snowy variant model (declared in .mcmeta files, kept in its SnowVariantModel wrapper).", "details": ["Fabric: draws through Fabric's rendering API (SnowCoveredModel.emitBlockQuads).", "Forge: carries its own copy of Fabric's rendering API and Indigo (jar-in-jar); SnowVariantModel only picks the variant through emitBlockQuads, never getQuads.", "Plants it raises onto the snow are tagged snowrealmagic:offset_y (+0.101).", "10.x (1.20.1): one snow block holds plants, snowrealmagic:snow (EntitySnowLayerBlock); the snowy variants are mapped in SnowClient.snowVariantMapping.", "12.x (1.21.1): five SRMSnowLayerBlock blocks with the same SnowBlockEntity -- snow, snow_extra_collision, snowy_plant, and snowy_double_plant_lower/_upper, one per half of a tall plant; the snowy variants are mapped in ClientHooks.snowVariantMapping."], "fileInfo": {}}, {"id": "srm-compat", "label": "SnowRealMagicCompat", "group": "snowrealmagic", "kind": "compat", "files": ["gpu/SnowRealMagicCompat.java", "ModCompatRegistry.java"], "summary": "Read by name, never compiled against. Finds the plant a snow block holds, the snowy variant of a plant's model (walking the wrappers' wrapped/parent/originalModel fields), whether a model is drawn inside the snow (Forge: the snow's OPTIONS model property) and whether a tall plant's top half stands on it. Tested on 1.20.1 Fabric and Forge (vanilla and Embeddium) 1.21.1 Fabric (vanilla and Iris), 1.21.1 NeoForge (vanilla, Sodium and Iris), and 26.1.2 Fabric and NeoForge (vanilla, Sodium and Iris).", "details": ["Snow blocks are found by class (EntitySnowLayerBlock up to 10.x, SRMSnowLayerBlock from 12.x) once, then looked up by identity.", "Sway: ModCompatRegistry gives every snow block that holds plants a pipeline that only pushes (collision, proximity force, multiplier), no deformation: Sway pushes a position by its block, and the plant drawn there bends by its own pipeline. A deforming pipeline would bend the snow and the plant twice.", "GpuFoliageSplit.bends: foliage is what Sway bends, so the snow block is never wrapped, meshed or given a forced render layer; the plant inside it is.", "GPU mesher: a snow block holding a Sway plant meshes the plant (raised as offset_y says, not at 8 layers), with its snowy variant; the anchor and a tall plant's length read the plant inside the snow.", "The plant inside changes through its block entity: ClientLevelMixin follows ClientLevel.sendBlockUpdated for the snow block.", "GPU: a plant under the snow (held in it, or a tall plant's top half on it) keeps SNOW_LADEN_SWAY (20%) of its sway, wind included, scaled into its wave weight as it is meshed (GpuFoliageRenderer); pushes are untouched. No shader changes.", "snowVariants off in its client config: the plain model everywhere, as the chunk mesh."], "pitfalls": ["Forge and NeoForge force cutoutMipped on the blocks the mod registers (Sway's wrapper loses the render layer); only on blocks Sway bends: on the snow block it hid the snow (solid) and the plant (its own layer) entirely.", "Forge: Sway wraps every interactive block's state model, the push-only snow too, and its wrapper tells Indigo the model is plain; ForgeFoliageHooks unwraps blocks Sway only pushes. Each mod has its own mod event bus, so EventPriority only orders listeners within the mod's own bus.", "Forge dev: third-party mods must come through modRuntimeOnly (remapped), never raw jars in run/mods (their SRG mixins fail); Snow! Real Magic 10.7.0 is maven.modrinth:iJNje1E8:aQw97T9l, Kiwi 11.10.3 is ufdDoWPd:NSxwah05.", "Fabric 1.21.1 dev: Iris 1.8.14-beta.1 fails its mixins in the dev client; test Iris with the built jar in a launcher instance.", "NeoForge 1.21.1: Sway wraps the push-only snow's model too (as on Forge) and its wrapper says the model is plain, so Indigo drew the snow alone and the plant inside vanished on the CPU; NeoforgeFoliageHooks unwraps blocks Sway only pushes.", "SRM 12.x (NeoForge) can mark a snowy variant required (drawn even with snowVariants off); snowyVariantOf follows the config only.", "26.1.2 (SRM 26.0.x): the snowy variant lives in each part (SnowyBlockStateModelPart: normal + snowy), picked only when drawn through SRM's own emitter (SRMQuadEmitter) -- inside the snow always, a tall plant's top half on it while snowVariants is on. The GPU mesher asks parts through collectParts, so snowyVariant hands it a model whose parts are the snowy ones (field snowy, by reflection); NeoForge's Sway wraps each part in one that only has getQuads, so NeoforgeFoliageModel.collectParts hands Sway the snowy parts (snowyParts) before it wraps them.", "NeoForge 26.1.2: Forgified Fabric API draws every chunk block through emitQuads (its SectionCompilerMixin), and a non-Fabric model's default emitQuads is collectParts: Sway's wrapper around the push-only snow skipped SRM's drawing, so NeoforgeFoliageHooks.unwrapPushedOnly (LOWEST) unwraps it there too.", "Kiwi 26.0.20 (SRM's library) crashes opening the inventory on NeoForge 26.1.2.109: its EffectsInInventoryMixin targets renderText, which NeoForge renamed extractText. Not ours; test with /give.", "Snow! Real Magic has no release for 1.21.11, 26.2 or 26.3 yet: add them when it ships."], "fileInfo": {"gpu/SnowRealMagicCompat.java": {"kind": "java", "lines": 421, "guard": "//? <1.21.11 {"}, "ModCompatRegistry.java": {"kind": "java", "lines": 403, "guard": ""}}}, {"id": "srm-forge-indigo", "label": "Indigo mixins (Forge)", "group": "snowrealmagic", "kind": "hook", "loaders": ["forge"], "versions": ["<1.21.1"], "files": ["mixin/snowrealmagic/IndigoBlockPositionMixin.java", "mixin/snowrealmagic/IndigoBlockRenderMixin.java", "platform/forge/ForgeFoliageModel.java"], "summary": "@Pseudo mixins into the Indigo Snow! Real Magic carries, in their own optional config (mc2_interactivefoliage.snowrealmagic.mixins.json, Forge only). TerrainRenderContext.tessellateBlock (vanilla chunk builds) tells Sway the block's position (SwayRenderContext), which Sway otherwise only learns from ModelBlockRenderer.tesselateBlock, and makes the GPU decision for the plant in the snow; BlockRenderContext.render (Embeddium draws Fabric models through it) makes that decision in chunk builds only.", "details": ["ForgeFoliageModel: withholds a plant drawn inside the snow when the decision says GPU (GpuFoliageSplit.snowPlantLeftToGpu), and draws the snowy variant, wrapped in Sway's own SwayModel so it bends, where Snow! Real Magic would (inside the snow, or a tall plant's top half on it, marked ON_SNOW in getModelData)."], "fileInfo": {"mixin/snowrealmagic/IndigoBlockPositionMixin.java": {"kind": "java", "lines": 53, "guard": "//? forge {"}, "mixin/snowrealmagic/IndigoBlockRenderMixin.java": {"kind": "java", "lines": 53, "guard": "//? forge {"}, "platform/forge/ForgeFoliageModel.java": {"kind": "java", "lines": 115, "guard": "//? forge {"}}}, {"id": "srm-neoforge-render", "label": "SnowRenderApiMixin (NeoForge)", "group": "snowrealmagic", "kind": "hook", "loaders": ["neoforge"], "versions": ["<1.21.11"], "files": ["mixin/snowrealmagic/neoforge/SnowRenderApiMixin.java", "platform/neoforge/NeoforgeFoliageModel.java"], "summary": "@Pseudo mixin into Snow! Real Magic's FabricRendererRenderAPI.render, in its own optional config (snowrealmagic_neoforge.mixins.json). Sway on NeoForge bends by the model data getModelData gives, and the snow hands every part it draws the snow's: each part gets its own model's model data at the snow's position, as NeoForge's chunk compiler gives any block. Through Indigo (the copy SRM carries) as prepareForBlock is called; through Sodium, which prepares nothing, pushed on its context (pushModelData/popModelData, by reflection) around the part's emitBlockQuads.", "details": ["The same model data carries the rest: NeoforgeFoliageModel decides there whether the GPU renderer draws the plant (LEFT_TO_GPU, no duplicates) and whether it is drawn snowy (SNOWY: SnowRealMagicCompat.drawnSnowy, held in the snow or a tall plant's top half on it), then draws the snowy variant through Sway's own SwayModel so it bends.", "Tint: Indigo multiplies a tinted quad by the block's color after SRM's transform has already painted it with that color (a darker green); under Indigo only, the color SRM paints (BlockColors.getColor in lambda$render$0) is taken as white. Sodium tints by the drawn block (the snow, no color) and keeps SRM's."], "fileInfo": {"mixin/snowrealmagic/neoforge/SnowRenderApiMixin.java": {"kind": "java", "lines": 184, "guard": "//? neoforge && <1.21.11 {"}, "platform/neoforge/NeoforgeFoliageModel.java": {"kind": "java", "lines": 217, "guard": "//? neoforge && >=1.21.1 {"}}}, {"id": "blockgetter-fix", "label": "BlockGetterMixinPlugin", "group": "snowrealmagic", "kind": "hook", "loaders": ["neoforge"], "versions": [">=26.1.2"], "files": ["mixin/blockgetter/BlockGetterMixinPlugin.java", "mixin/blockgetter/LevelViewBlockGetterMixin.java"], "summary": "Iris 1.11.4 on NeoForge loads BlockGetter while Mixin prepares its configs (its DHMixinConfigPlugin asks IrisPlatformHelpers whether Distant Horizons is installed, and verifying IrisForgeHelpers loads BlockGetter), so Forgified Fabric API's BlockGetterMixin never adds FabricBlockGetter to it -- with or without a shader pack. Snow! Real Magic casts the chunk's level view to it and the game crashed on the first chunk. This config plugin names FabricBlockGetter on the views themselves as they load (Sodium's LevelSlice, RenderSectionRegion, Level), by name, only when the API is installed; its methods are all defaults.", "details": ["Found with -Xlog:class+load and -Dmixin.debug.verbose: 'Mixing BlockGetterMixin' never appears while LevelReaderMixin and BlockEntityMixin do."], "fileInfo": {"mixin/blockgetter/BlockGetterMixinPlugin.java": {"kind": "java", "lines": 70, "guard": "//? neoforge && >=26.1.2 {"}, "mixin/blockgetter/LevelViewBlockGetterMixin.java": {"kind": "java", "lines": 21, "guard": "//? neoforge && >=26.1.2 {"}}}, {"id": "sway-variants", "label": "SwayVariantModels", "group": "snowrealmagic", "kind": "compat", "loaders": ["fabric"], "versions": ["<1.21.11"], "files": ["platform/fabric/SwayVariantModels.java"], "summary": "Fabric 1.20.1 and 1.21.1: Sway wraps model files by name (block/<name> taken for block <name>), so a model a plant's block state names otherwise -- a resource pack's extra variants, Snow! Real Magic's snowy variants -- never bends. Wraps them with Sway's own SwayModel, leaving the ones Sway reaches alone. Snow! Real Magic's variant map is read from SnowClient (10.x) or ClientHooks (12.x).", "details": ["From 1.21.11 (and on Forge 1.20.1) Sway wraps each block state's whole model, and every variant bends already."], "fileInfo": {"platform/fabric/SwayVariantModels.java": {"kind": "java", "lines": 176, "guard": "//? fabric && <1.21.11 {"}}}, {"id": "snow-shake", "label": "SnowShakeParticles", "group": "snowrealmagic", "kind": "component", "files": ["gpu/SnowShakeParticles.java"], "summary": "Shakes snow off a plant in Snow! Real Magic's snow the moment a push starts (from Sway's engine, any entity, CPU or GPU): up to 5 particles by the push's strength, a quarter crumbs of snow and the rest snowflakes, drifting the way it was pushed, from the plant's top (a tall plant: where its top half begins). One second per plant between shakes; the game's particle setting applies. Ticked from Fabric's END_CLIENT_TICK and Forge's ClientTickEvent END.", "fileInfo": {"gpu/SnowShakeParticles.java": {"kind": "java", "lines": 138, "guard": "//? >=1.20.1 {"}}}, {"id": "fabric-hooks", "label": "FabricFoliageHooks", "group": "loader", "kind": "hook", "loaders": ["fabric"], "files": ["platform/fabric/FabricFoliageHooks.java", "platform/fabric/FabricEntrypoint.java", "platform/fabric/FabricClientEntrypoint.java", "platform/fabric/FabricPlatform.java"], "summary": "Fabric: model wrapping, the frame event, chunk load/unload.", "details": ["1.20.1/1.21.1: WorldRenderEvents.BEFORE_ENTITIES (+ CoreShaderRegistrationCallback for the legacy shader)", "1.21.11: WorldRenderEvents.BEFORE_TRANSLUCENT", "26.1.2/26.2: LevelRenderEvents.AFTER_OPAQUE_TERRAIN", "26.3: LevelExtractionEvents.END_EXTRACTION (prepare only)"], "fileInfo": {"platform/fabric/FabricFoliageHooks.java": {"kind": "java", "lines": 115, "guard": "//? fabric {"}, "platform/fabric/FabricEntrypoint.java": {"kind": "java", "lines": 18, "guard": "//? fabric {"}, "platform/fabric/FabricClientEntrypoint.java": {"kind": "java", "lines": 32, "guard": "//? fabric {"}, "platform/fabric/FabricPlatform.java": {"kind": "java", "lines": 26, "guard": "//? fabric {"}}}, {"id": "neoforge-hooks", "label": "NeoforgeFoliageHooks", "group": "loader", "kind": "hook", "loaders": ["neoforge"], "files": ["platform/neoforge/NeoforgeFoliageHooks.java", "platform/neoforge/NeoforgeEntrypoint.java", "platform/neoforge/NeoforgeClientEventSubscriber.java", "platform/neoforge/NeoforgePlatform.java"], "summary": "NeoForge: model wrapping at ModifyBakingResult, the frame event, chunk events.", "details": ["1.21.1: RenderLevelStageEvent, stage AFTER_CUTOUT_BLOCKS (+ RegisterShadersEvent)", "1.21.11-26.2: RenderLevelStageEvent.AfterOpaqueBlocks", "26.3: ExtractLevelRenderStateEvent (prepare only). AfterOpaqueBlocks now fires inside vanilla's pass and hands it over."], "fileInfo": {"platform/neoforge/NeoforgeFoliageHooks.java": {"kind": "java", "lines": 258, "guard": "//? neoforge && >=1.21.1 {"}, "platform/neoforge/NeoforgeEntrypoint.java": {"kind": "java", "lines": 66, "guard": "//? neoforge {"}, "platform/neoforge/NeoforgeClientEventSubscriber.java": {"kind": "java", "lines": 40, "guard": "//? neoforge {"}, "platform/neoforge/NeoforgePlatform.java": {"kind": "java", "lines": 54, "guard": "//? neoforge {"}}}, {"id": "forge-hooks", "label": "ForgeFoliageHooks", "group": "loader", "kind": "hook", "loaders": ["forge"], "versions": ["<1.21.1"], "files": ["platform/forge/ForgeFoliageHooks.java", "platform/forge/ForgeEntrypoint.java", "platform/forge/ForgeClientEventSubscriber.java", "platform/forge/ForgePlatform.java"], "summary": "Forge 1.20.1: RenderLevelStageEvent AFTER_CUTOUT_BLOCKS (Embeddium fires it per layer too), RegisterShadersEvent and ModifyBakingResult on the mod bus, ChunkEvent on the Forge bus.", "pitfalls": ["Forge needs the refmap key in every mixin config and all configs in the MixinConfigs manifest attribute (build-logic does both)."], "fileInfo": {"platform/forge/ForgeFoliageHooks.java": {"kind": "java", "lines": 186, "guard": "//? forge {"}, "platform/forge/ForgeEntrypoint.java": {"kind": "java", "lines": 68, "guard": "//? forge {"}, "platform/forge/ForgeClientEventSubscriber.java": {"kind": "java", "lines": 30, "guard": "//? forge {"}, "platform/forge/ForgePlatform.java": {"kind": "java", "lines": 46, "guard": "//? forge {"}}}, {"id": "level-pass", "label": "LevelPassMixin", "group": "core", "kind": "hook", "versions": [">=26.3"], "files": ["mixin/LevelPassMixin.java"], "summary": "26.3+, both loaders: writes the view uniforms at LevelRenderer.render HEAD and draws into vanilla's pass in executeSolid, before FeatureRenderDispatcher.PreparedFrame.executeSolid.", "fileInfo": {"mixin/LevelPassMixin.java": {"kind": "java", "lines": 50, "guard": "//? >=26.3 {"}}}, {"id": "stonecutter", "label": "Stonecutter", "group": "build", "kind": "rule", "summary": "One source tree for every version: //? guards, commented branches /* */, nested /^ ^/. Constants: fabric/neoforge/forge and iris (shader pack support: >=1.20.1).", "details": ["The newest version is vcsVersion and active (26.3-fabric): commit in its form, never switch back to commit.", "Switch with ./gradlew \"Set active project to <v>\"."], "pitfalls": ["A branch whose whole body is // comments gets mangled when switching; put the explanation above the guard.", "Scripts that edit sources must edit the exact current (active or commented) text."], "fileInfo": {}}, {"id": "build-logic", "label": "build-logic", "group": "build", "kind": "rule", "summary": "Loader.kt writes fabric.mod.json / neoforge.mods.toml and their mixin lists per version; ModPlatformPlugin excludes resources per version (shader sets, iris/polytone/pass mixin configs); Context.shaderPackSupport mirrors the iris constant. The NeoForge manifest names an access transformer where its file is not empty (26.3), and from 26.2 an iconFile, and a bannerFile once assets/<modid>/banner.png exists, in place of the logoFile those versions warn about.", "pitfalls": ["The main mixins.json stays hand-written and empty: FletchingTable list generation once swept Iris/Polytone mixins into it. Check the built jar's mixin JSONs after touching mixin or build config."], "fileInfo": {}}, {"id": "mixin-configs", "label": "Mixin configs", "group": "build", "kind": "rule", "summary": "mixins.json (empty), gpu.mixins.json (>=1.20.1), iris.mixins.json (where shader pack support is compiled; IrisMixinPlugin), polytone.mixins.json (1.21.1-26.2; required:false), pass.mixins.json (26.3+), snowrealmagic.mixins.json (Forge; required:false), snowrealmagic_neoforge.mixins.json (NeoForge before 1.21.11; required:false), blockgetter.mixins.json (NeoForge 26.1.2+; BlockGetterMixinPlugin, required:false).", "fileInfo": {}}, {"id": "access", "label": "Access wideners", "group": "build", "kind": "rule", "summary": "aw/<version>.accesswidener (Fabric) and aw/<version>.cfg (NeoForge/Forge AT). 26.3's widener opens GlRenderPipeline's constructor for the Iris path, and its .cfg does the same on NeoForge, named in neoforge.mods.toml since it is not under META-INF.", "fileInfo": {}}, {"id": "dev-runs", "label": "Dev-run traps", "group": "build", "kind": "rule", "summary": "Things that break runClient but not players.", "details": ["26.3 Fabric: Loom omits Mojang's -XX:StackShadowPages=32 and --add-exports java.base/jdk.internal.misc=ALL-UNNAMED: random native deaths (0xC0000005). Added as vmArgs.", "26.3 NeoForge: ModDevGradle passes StackShadowPages but not the export (added); NeoForm runtime 2.0.31 needed to recompile 26.3.", "NeoForge dev validates draws and crashes on Iris's one-element binding arrays, in Iris's own shadow pass too: -Dneoforge.disableGlValidation=true, renamed -Dneoforge.disableBlaze3DValidation=true on 26.3 (FrontendGpuDevice.STRICT_VALIDATION); the client run sets both.", "Fabric 1.21.1 dev + Iris 1.8.14 crashes in the dev remapper: test in a launcher instance.", "Test mods live in versions/<v>/run/mods; the user provides them in versions/<v> mods/<loader>.", "Forge 1.20.1 dev runs on named mappings: third-party mods go through modRuntimeOnly in build.forge.gradle.kts (remapped), their raw jars in run/mods renamed .disabled."], "fileInfo": {}}, {"id": "fabric-api", "label": "Fabric API", "group": "external", "kind": "mod", "loaders": ["fabric"], "summary": "Rendering API (FRAPI) for the model split and Sway, ModelLoadingPlugin, render and chunk events.", "fileInfo": {}}, {"id": "v-1.20.1", "label": "1.20.1", "group": "version", "kind": "version", "versions": ["<1.21.1"], "summary": "Fabric and Forge. Legacy draw with foliage_legacy_1_20. Sodium 0.5 + Indium (Fabric) or Embeddium (Forge). Iris 1.7 / Oculus 1.8. No Polytone shadow map.", "fileInfo": {}}, {"id": "v-1.21.1", "label": "1.21.1", "group": "version", "kind": "version", "versions": [">=1.21.1", "<1.21.11"], "summary": "Fabric and NeoForge. Legacy draw with foliage_legacy. Sodium 0.8. Iris with ShaderInstance programs. Polytone shadow map from here.", "fileInfo": {}}, {"id": "v-1.21.11", "label": "1.21.11", "group": "version", "kind": "version", "versions": [">=1.21.11", "<26.1.2"], "summary": "Fabric and NeoForge. RenderPipelines, own pass after BEFORE_TRANSLUCENT / AfterOpaqueBlocks. Terrain and Sodium shader following start here.", "fileInfo": {}}, {"id": "v-26.1.2", "label": "26.1.2", "group": "version", "kind": "version", "versions": [">=26.1.2", "<26.2"], "summary": "Fa function renderMatrix() {
  const vs = DATA.meta.versions;
  const cell = (text) => {
    if (!text) return `<span style="color:var(--faint)">—</span>`;
    const parts = text.split(" | ");
    return parts.map((part) => {
      const m = part.match(/^(fabric|neoforge|forge|both): (.*)$/);
      if (m && state.loader && m[1] !== state.loader && m[1] !== "both") return "";
      return m ? `<span class="ld"><b>${m[1]}</b>${esc(m[2])}</span>` : `<span class="ld">${esc(part)}</span>`;
    }).join("");
  };
  $("matrix").innerHTML = `<h2>Versions at a glance</h2><p>${esc(DATA.matrix.about)} Pick a version above to highlight its column, a loader to keep only its lines.</p>
    <div class="matrix-wrap"><table><thead><tr><th></th>${vs.map((v) => `<th class="${v === state.version ? "sel" : ""}">${v}</th>`).join("")}</tr></thead>
    <tbody>${DATA.matrix.rows.map((r) => `<tr><th scope="row">${esc(r.label)}</th>${vs.map((v) => `<td class="${v === state.version ? "sel" : ""}">${cell(r.cells[v])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function renderRecipe() {
  $("recipe").innerHTML = `<h2>Porting to a new version</h2><p>The order the 26.3 port followed, one step and one test at a time.</p>
    <ol class="recipe">${DATA.portRecipe.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    <h2 style="margin-top:34px">Working rules</h2><ul class="rules">${DATA.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`;
}

const views = { map: "main-map", matrix: "main-matrix", recipe: "main-recipe" };
function show(view) {
  Object.entries(views).forEach(([k, id]) => { $(id).hidden = k !== view; $("tab-" + k).setAttribute("aria-pressed", k === view); });
  try { localStorage.setItem("atlas-view", view); } catch (e) {}
  if (view === "map") resize();
}
Object.keys(views).forEach((k) => $("tab-" + k).addEventListener("click", () => show(k)));

function refresh() { renderFilters(); paintGraph(); renderPanel(); renderMatrix(); }
renderLegend(); refresh(); layoutCenters($("graph").clientWidth || 800, $("graph").clientHeight || 600);
let start = "map"; try { start = localStorage.getItem("atlas-view") || "map"; } catch (e) {}
if (["matrix", "recipe"].includes(location.hash.slice(1))) start = location.hash.slice(1);
renderRecipe(); show(start);
</script>
