 test with /give.", "Snow! Real Magic has no release for 1.21.11, 26.2 or 26.3 yet: add them when it ships."], "fileInfo": {"gpu/SnowRealMagicCompat.java": {"kind": "java", "lines": 421, "guard": "//? <1.21.11 {"}, "ModCompatRegistry.java": {"kind": "java", "lines": 444, "guard": ""}}}, {"id": "srm-forge-indigo", "label": "Indigo mixins (Forge)", "group": "snowrealmagic", "kind": "hook", "loaders": ["forge"], "versions": ["<1.21.1"], "files": ["mixin/snowrealmagic/IndigoBlockPositionMixin.java", "mixin/snowrealmagic/IndigoBlockRenderMixin.java", "platform/forge/ForgeFoliageModel.java"], "summary": "@Pseudo mixins into the Indigo Snow! Real Magic carries, in their own optional config (mc2_interactivefoliage.snowrealmagic.mixins.json, Forge only). TerrainRenderContext.tessellateBlock (vanilla chunk builds) tells Sway the block's position (SwayRenderContext), which Sway otherwise only learns from ModelBlockRenderer.tesselateBlock, and makes the GPU decision for the plant in the snow; BlockRenderContext.render (Embeddium draws Fabric models through it) makes that decision in chunk builds only.", "details": ["ForgeFoliageModel: withholds a plant drawn inside the snow when the decision says GPU (GpuFoliageSplit.snowPlantLeftToGpu), and draws the snowy variant, wrapped in Sway's own SwayModel so it bends, where Snow! Real Magic would (inside the snow, or a tall plant's top half on it, marked ON_SNOW in getModelData)."], "fileInfo": {"mixin/snowrealmagic/IndigoBlockPositionMixin.java": {"kind": "java", "lines": 53, "guard": "//? forge {"}, "mixin/snowrealmagic/IndigoBlockRenderMixin.java": {"kind": "java", "lines": 53, "guard": "//? forge {"}, "platform/forge/ForgeFoliageModel.java": {"kind": "java", "lines": 115, "guard": "//? forge {"}}}, {"id": "srm-neoforge-render", "label": "SnowRenderApiMixin (NeoForge)", "group": "snowrealmagic", "kind": "hook", "loaders": ["neoforge"], "versions": ["<1.21.11"], "files": ["mixin/snowrealmagic/neoforge/SnowRenderApiMixin.java", "platform/neoforge/NeoforgeFoliageModel.java"], "summary": "@Pseudo mixin into Snow! Real Magic's FabricRendererRenderAPI.render, in its own optional config (snowrealmagic_neoforge.mixins.json). Sway on NeoForge bends by the model data getModelData gives, and the snow hands every part it draws the snow's: each part gets its own model's model data at the snow's position, as NeoForge's chunk compiler gives any block. Through Indigo (the copy SRM carries) as prepareForBlock is called; through Sodium, which prepares nothing, pushed on its context (pushModelData/popModelData, by reflection) around the part's emitBlockQuads.", "details": ["The same model data carries the rest: NeoforgeFoliageModel decides there whether the GPU renderer draws the plant (LEFT_TO_GPU, no duplicates) and whether it is drawn snowy (SNOWY: SnowRealMagicCompat.drawnSnowy, held in the snow or a tall plant's top half on it), then draws the snowy variant through Sway's own SwayModel so it bends.", "Tint: Indigo multiplies a tinted quad by the block's color after SRM's transform has already painted it with that color (a darker green); under Indigo only, the color SRM paints (BlockColors.getColor in lambda$render$0) is taken as white. Sodium tints by the drawn block (the snow, no color) and keeps SRM's."], "fileInfo": {"mixin/snowrealmagic/neoforge/SnowRenderApiMixin.java": {"kind": "java", "lines": 184, "guard": "//? neoforge && <1.21.11 {"}, "platform/neoforge/NeoforgeFoliageModel.java": {"kind": "java", "lines": 217, "guard": "//? neoforge && >=1.21.1 {"}}}, {"id": "blockgetter-fix", "label": "BlockGetterMixinPlugin", "group": "snowrealmagic", "kind": "hook", "loaders": ["neoforge"], "versions": [">=26.1.2"], "files": ["mixin/blockgetter/BlockGetterMixinPlugin.java", "mixin/blockgetter/LevelViewBlockGetterMixin.java"], "summary": "Iris 1.11.4 on NeoForge loads BlockGetter while Mixin prepares its configs (its DHMixinConfigPlugin asks IrisPlatformHelpers whether Distant Horizons is installed, and verifying IrisForgeHelpers loads BlockGetter), so Forgified Fabric API's BlockGetterMixin never adds FabricBlockGetter to it -- with or without a shader pack. Snow! Real Magic casts the chunk's level view to it and the game crashed on the first chunk. This config plugin names FabricBlockGetter on the views themselves as they load (Sodium's LevelSlice, RenderSectionRegion, Level), by name, only when the API is installed; its methods are all defaults.", "details": ["Found with -Xlog:class+load and -Dmixin.debug.verbose: 'Mixing BlockGetterMixin' never appears while LevelReaderMixin and BlockEntityMixin do."], "fileInfo": {"mixin/blockgetter/BlockGetterMixinPlugin.java": {"kind": "java", "lines": 70, "guard": "//? neoforge && >=26.1.2 {"}, "mixin/blockgetter/LevelViewBlockGetterMixin.java": {"kind": "java", "lines": 21, "guard": "//? neoforge && >=26.1.2 {"}}}, {"id": "sway-variants", "label": "SwayVariantModels", "group": "snowrealmagic", "kind": "compat", "loaders": ["fabric"], "versions": ["<1.21.11"], "files": ["platform/fabric/SwayVariantModels.java"], "summary": "Fabric 1.20.1 and 1.21.1: Sway wraps model files by name (block/<name> taken for block <name>), so a model a plant's block state names otherwise -- a resource pack's extra variants, Snow! Real Magic's snowy variants -- never bends. Wraps them with Sway's own SwayModel, leaving the ones Sway reaches alone. Snow! Real Magic's variant map is read from SnowClient (10.x) or ClientHooks (12.x).", "details": ["From 1.21.11 (and on Forge 1.20.1) Sway wraps each block state's whole model, and every variant bends already."], "fileInfo": {"platform/fabric/SwayVariantModels.java": {"kind": "java", "lines": 176, "guard": "//? fabric && <1.21.11 {"}}}, {"id": "snow-shake", "label": "SnowShakeParticles", "group": "snowrealmagic", "kind": "component", "files": ["gpu/SnowShakeParticles.java"], "summary": "Shakes snow off a plant in Snow! Real Magic's snow the moment a push starts (from Sway's engine, any entity, CPU or GPU): up to 5 particles by the push's strength, a quarter crumbs of snow and the rest snowflakes, drifting the way it was pushed, from the plant's top (a tall plant: where its top half begins). One second per plant between shakes; the game's particle setting applies. Ticked from Fabric's END_CLIENT_TICK and Forge's ClientTickEvent END.", "fileInfo": {"gpu/SnowShakeParticles.java": {"kind": "java", "lines": 138, "guard": "//? >=1.20.1 {"}}}, {"id": "fabric-hooks", "label": "FabricFoliageHooks", "group": "loader", "kind": "hook", "loaders": ["fabric"], "files": ["platform/fabric/FabricFoliageHooks.java", "platform/fabric/FabricEntrypoint.java", "platform/fabric/FabricClientEntrypoint.java", "platform/fabric/FabricPlatform.java"], "summary": "Fabric: model wrapping, the frame event, chunk load/unload.", "details": ["1.20.1/1.21.1: WorldRenderEvents.BEFORE_ENTITIES (+ CoreShaderRegistrationCallback for the legacy shader)", "1.21.11: WorldRenderEvents.BEFORE_ENTITIES, right after the opaque terrain. Not BEFORE_TRANSLUCENT: Iris runs the pack's deferred passes and keeps its depth without translucents (depthtex1) just before that event, so foliage drawn there was missing from both and a pack's light shafts shone through it.", "26.1.2/26.2: LevelRenderEvents.AFTER_OPAQUE_TERRAIN", "26.3: LevelExtractionEvents.END_EXTRACTION (prepare only)"], "fileInfo": {"platform/fabric/FabricFoliageHooks.java": {"kind": "java", "lines": 120, "guard": "//? fabric {"}, "platform/fabric/FabricEntrypoint.java": {"kind": "java", "lines": 18, "guard": "//? fabric {"}, "platform/fabric/FabricClientEntrypoint.java": {"kind": "java", "lines": 32, "guard": "//? fabric {"}, "platform/fabric/FabricPlatform.java": {"kind": "java", "lines": 26, "guard": "//? fabric {"}}}, {"id": "neoforge-hooks", "label": "NeoforgeFoliageHooks", "group": "loader", "kind": "hook", "loaders": ["neoforge"], "files": ["platform/neoforge/NeoforgeFoliageHooks.java", "platform/neoforge/NeoforgeEntrypoint.java", "platform/neoforge/NeoforgeClientEventSubscriber.java", "platform/neoforge/NeoforgePlatform.java"], "summary": "NeoForge: model wrapping at ModifyBakingResult, the frame event, chunk events.", "details": ["1.21.1: RenderLevelStageEvent, stage AFTER_CUTOUT_BLOCKS (+ RegisterShadersEvent)", "1.21.11-26.2: RenderLevelStageEvent.AfterOpaqueBlocks", "26.3: ExtractLevelRenderStateEvent (prepare only). AfterOpaqueBlocks now fires inside vanilla's pass and hands it over."], "fileInfo": {"platform/neoforge/NeoforgeFoliageHooks.java": {"kind": "java", "lines": 258, "guard": "//? neoforge && >=1.21.1 {"}, "platform/neoforge/NeoforgeEntrypoint.java": {"kind": "java", "lines": 66, "guard": "//? neoforge {"}, "platform/neoforge/NeoforgeClientEventSubscriber.java": {"kind": "java", "lines": 40, "guard": "//? neoforge {"}, "platform/neoforge/NeoforgePlatform.java": {"kind": "java", "lines": 54, "guard": "//? neoforge {"}}}, {"id": "forge-hooks", "label": "ForgeFoliageHooks", "group": "loader", "kind": "hook", "loaders": ["forge"], "versions": ["<1.21.1"], "files": ["platform/forge/ForgeFoliageHooks.java", "platform/forge/ForgeEntrypoint.java", "platform/forge/ForgeClientEventSubscriber.java", "platform/forge/ForgePlatform.java"], "summary": "Forge 1.20.1: RenderLevelStageEvent AFTER_CUTOUT_BLOCKS (Embeddium fires it per layer too), RegisterShadersEvent and ModifyBakingResult on the mod bus, ChunkEvent on the Forge bus.", "pitfalls": ["Forge needs the refmap key in every mixin config and all configs in the MixinConfigs manifest attribute (build-logic does both)."], "fileInfo": {"platform/forge/ForgeFoliageHooks.java": {"kind": "java", "lines": 186, "guard": "//? forge {"}, "platform/forge/ForgeEntrypoint.java": {"kind": "java", "lines": 68, "guard": "//? forge {"}, "platform/forge/ForgeClientEventSubscriber.java": {"kind": "java", "lines": 30, "guard": "//? forge {"}, "platform/forge/ForgePlatform.java": {"kind": "java", "lines": 46, "guard": "//? forge {"}}}, {"id": "level-pass", "label": "LevelPassMixin", "group": "core", "kind": "hook", "versions": [">=26.3"], "files": ["mixin/LevelPassMixin.java"], "summary": "26.3+, both loaders: writes the view uniforms at LevelRenderer.render HEAD and draws into vanilla's pass in executeSolid, before FeatureRenderDispatcher.PreparedFrame.executeSolid.", "fileInfo": {"mixin/LevelPassMixin.java": {"kind": "java", "lines": 50, "guard": "//? >=26.3 {"}}}, {"id": "stonecutter", "label": "Stonecutter", "group": "build", "kind": "rule", "summary": "One source tree for every version: //? guards, commented branches /* */, nested /^ ^/. Constants: fabric/neoforge/forge and iris (shader pack support: >=1.20.1).", "details": ["The newest version is vcsVersion and active (26.3-fabric): commit in its form, never switch back to commit.", "Switch with ./gradlew \"Set active project to <v>\"."], "pitfalls": ["A branch whose whole body is // comments gets mangled when switching; put the explanation above the guard.", "Scripts that edit sources must edit the exact current (active or commented) text."], "fileInfo": {}}, {"id": "build-logic", "label": "build-logic", "group": "build", "kind": "rule", "summary": "Loader.kt writes fabric.mod.json / neoforge.mods.toml and their mixin lists per version; ModPlatformPlugin excludes resources per version (shader sets, iris/polytone/pass mixin configs); Context.shaderPackSupport mirrors the iris constant. The NeoForge manifest names an access transformer where its file is not empty (26.3), and from 26.2 an iconFile, and a bannerFile once assets/<modid>/banner.png exists, in place of the logoFile those versions warn about.", "pitfalls": ["The main mixins.json stays hand-written and empty: FletchingTable list generation once swept Iris/Polytone mixins into it. Check the built jar's mixin JSONs after touching mixin or build config."], "fileInfo": {}}, {"id": "mixin-configs", "label": "Mixin configs", "group": "build", "kind": "rule", "summary": "mixins.json (empty), gpu.mixins.json (>=1.20.1), iris.mixins.json (where shader pack support is compiled; IrisMixinPlugin), polytone.mixins.json (1.21.1-26.2; required:false), pass.mixins.json (26.3+), snowrealmagic.mixins.json (Forge; required:false), snowrealmagic_neoforge.mixins.json (NeoForge before 1.21.11; required:false), blockgetter.mixins.json (NeoForge 26.1.2+; BlockGetterMixinPlugin, required:false).", "fileInfo": {}}, {"id": "access", "label": "Access wideners", "group": "build", "kind": "rule", "summary": "aw/<version>.accesswidener (Fabric) and aw/<version>.cfg (NeoForge/Forge AT). 26.3's widener opens GlRenderPipeline's constructor for the Iris path, and its .cfg does the same on NeoForge, named in neoforge.mods.toml since it is not under META-INF.", "fileInfo": {}}, {"id": "dev-runs", "label": "Dev-run traps", "group": "build", "kind": "rule", "summary": "Things that break runClient but not players.", "details": ["26.3 Fabric: Loom omits Mojang's -XX:StackShadowPages=32 and --add-exports java.base/jdk.internal.misc=ALL-UNNAMED: random native deaths (0xC0000005). Added as vmArgs.", "26.3 NeoForge: ModDevGradle passes StackShadowPages but not the export (added); NeoForm runtime 2.0.31 needed to recompile 26.3.", "NeoForge dev validates draws and crashes on Iris's one-element binding arrays, in Iris's own shadow pass too: -Dneoforge.disableGlValidation=true, renamed -Dneoforge.disableBlaze3DValidation=true on 26.3 (FrontendGpuDevice.STRICT_VALIDATION); the client run sets both.", "Fabric 1.21.1 dev + Iris 1.8.14 crashes in the dev remapper: test in a launcher instance.", "Test mods live in versions/<v>/run/mods; the user provides them in versions/<v> mods/<loader>.", "Forge 1.20.1 dev runs on named mappings: third-party mods go through modRuntimeOnly in build.forge.gradle.kts (remapped), their raw jars in run/mods renamed .disabled."], "fileInfo": {}}, {"id": "fabric-api", "label": "Fabric API", "group": "external", "kind": "mod", "loaders": ["fabric"], "summary": "Rendering API (FRAPI) for the model split and Swa       <div class="stats"><div><b>${shown.length}</b><span>pieces</span></div><div><b>${DATA.edges.length}</b><span>links</span></div><div><b>${pit}</b><span>pitfalls</span></div></div>
      <h3>About this map</h3><p>${esc(DATA.meta.about)}</p>
      ${DATA.unmapped.length ? `<h3>Files not on the map</h3><ul class="files">${DATA.unmapped.map((f) => `<li><code>${esc(f)}</code></li>`).join("")}</ul>` : ""}
      <h3>Constellations</h3><ul>${DATA.groups.map((g) => `<li><b style="color:${groupColor(g.id)}">${esc(g.label)}</b>: ${esc(g.about)}</li>`).join("")}</ul>`;
    return;
  }
  const n = byId[state.selected], g = groups[n.group];
  const out = DATA.edges.filter((e) => e.source === n.id).map((e) => ({ id: e.target, label: e.label }));
  const inn = DATA.edges.filter((e) => e.target === n.id).map((e) => ({ id: e.source, label: e.label, back: true }));
  const fi = n.fileInfo || {};
  p.innerHTML = `
    <h2>${esc(n.label)}</h2>
    <div class="meta"><span class="tag group" style="background:${groupColor(n.group)}">${esc(g.label)}</span>${scope(n).map((s) => `<span class="tag">${esc(s)}</span>`).join("")}
      ${applies(n) ? "" : `<span class="tag" style="color:var(--warn)">not in this version</span>`}</div>
    <p>${esc(n.summary)}</p>
    ${(n.details || []).length ? `<h3>How it works</h3><ul>${n.details.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
    ${(n.pitfalls || []).length ? `<h3>Pitfalls</h3><ul class="pitfalls">${n.pitfalls.map((d) => `<li><span>${esc(d)}</span></li>`).join("")}</ul>` : ""}
    ${(n.files || []).length ? `<h3>Files</h3><ul class="files">${n.files.map((f) => `<li><code>${esc(f)}</code><em>${fi[f] ? fi[f].lines + " lines" + (fi[f].guard ? " · " + esc(fi[f].guard.replace("//? ", "").replace(" {", "")) : "") : ""}</em></li>`).join("")}</ul>` : ""}
    ${out.length || inn.length ? `<h3>Connections</h3><ul class="links">${[...out, ...inn].map((l) =>
      `<li><small>${l.back ? "← " : ""}${esc(l.label)}${l.back ? "" : " →"}</small> <button class="link" data-id="${esc(l.id)}">${esc(byId[l.id].label)}</button></li>`).join("")}</ul>` : ""}`;
  p.querySelectorAll(".link").forEach((b) => b.addEventListener("click", () => select(b.dataset.id)));
}

/* ---------- versions & recipe ---------- */
function renderMatrix() {
  const vs = DATA.meta.versions;
  const cell = (text) => {
    if (!text) return `<span style="color:var(--faint)">—</span>`;
    const parts = text.split(" | ");
    return parts.map((part) => {
      const m = part.match(/^(fabric|neoforge|forge|both): (.*)$/);
      if (m && state.loader && m[1] !== state.loader && m[1] !== "both") return "";
      return m ? `<span class="ld"><b>${m[1]}</b>${esc(m[2])}</span>` : `<span class="ld">${esc(part)}</span>`;
    }).join("");
  };
  $("matrix").innerHTML = `<h2>Versions at a glance</h2><p>${esc(DATA.matrix.about)} Pick a version above to highlight its column, a loader to keep only its lines.</p>
    <div class="matrix-wrap"><table><thead><tr><th></th>${vs.map((v) => `<th class="${v === state.version ? "sel" : ""}">${v}</th>`).join("")}</tr></thead>
    <tbody>${DATA.matrix.rows.map((r) => `<tr><th scope="row">${esc(r.label)}</th>${vs.map((v) => `<td class="${v === state.version ? "sel" : ""}">${cell(r.cells[v])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function renderRecipe() {
  $("recipe").innerHTML = `<h2>Porting to a new version</h2><p>The order the 26.3 port followed, one step and one test at a time.</p>
    <ol class="recipe">${DATA.portRecipe.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    <h2 style="margin-top:34px">Working rules</h2><ul class="rules">${DATA.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`;
}

const views = { map: "main-map", matrix: "main-matrix", recipe: "main-recipe" };
function show(view) {
  Object.entries(views).forEach(([k, id]) => { $(id).hidden = k !== view; $("tab-" + k).setAttribute("aria-pressed", k === view); });
  try { localStorage.setItem("atlas-view", view); } catch (e) {}
  if (view === "map") resize();
}
Object.keys(views).forEach((k) => $("tab-" + k).addEventListener("click", () => show(k)));

function refresh() { renderFilters(); paintGraph(); renderPanel(); renderMatrix(); }
renderLegend(); refresh(); layoutCenters($("graph").clientWidth || 800, $("graph").clientHeight || 600);
let start = "map"; try { start = localStorage.getItem("atlas-view") || "map"; } catch (e) {}
if (["matrix", "recipe"].includes(location.hash.slice(1))) start = location.hash.slice(1);
renderRecipe(); show(start);
</script>
