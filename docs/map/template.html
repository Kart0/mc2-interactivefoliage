<title>MC2 Foliage Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night canopy. The constellation fills the stage, a reading panel sits to its right (below it on phones);
   version and loader filters ride in the top bar like a field guide's tabs. Deliberately one dark look. */
:root {
  --ground: #0d1613;
  --ground-2: #121e1a;
  --panel: #16231f;
  --line: #26372f;
  --fg: #e3ebdd;
  --muted: #94a89c;
  --faint: #5f7268;
  --pollen: #e8c36a;
  --warn: #f09a72;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --g-core: #7fd49a; --g-split: #b7d46c; --g-motion: #8ecae9; --g-shaders: #b8a4f0; --g-terrain: #d9a97a;
  --g-sodium: #8fe0cc; --g-iris: #f0a2c9; --g-polytone: #f2d27a; --g-loader: #aeb8ff; --g-build: #a4ada8;
  --g-external: #e6ddcb; --g-version: #e8c36a; --g-snowrealmagic: #a9dcff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--fg); font: 15px/1.5 var(--body); }
.app { display: flex; flex-direction: column; height: 100%; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px 12px;
  border-bottom: 1px solid var(--line); background: var(--ground-2); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1.1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs { margin-left: auto; }
button { font: inherit; color: inherit; }
.tab, .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px;
  cursor: pointer; font-size: 13px; color: var(--muted); }
.tab[aria-pressed="true"], .chip[aria-pressed="true"] { color: var(--ground); background: var(--pollen); border-color: var(--pollen); }
.tab:focus-visible, .chip:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--pollen); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.filters label.cap { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.fgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#search { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 5px 10px;
  width: 220px; max-width: 100%; font: 13px var(--body); }

main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; }
.legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 28px);
  font-size: 12px; color: var(--muted); pointer-events: auto; }
.legend button { background: none; border: 0; padding: 2px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend button[aria-pressed="false"] { opacity: 0.35; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }

aside { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 22px 28px; }
aside h2 { margin: 0 0 4px; font: 700 21px/1.2 var(--display); text-wrap: balance; }
aside h3 { margin: 22px 0 8px; font: 600 11px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
aside p { margin: 0 0 10px; }
aside ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.tag { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--ground); border: 1px solid var(--line); color: var(--muted); }
.tag.group { color: var(--ground); border: 0; }
.pitfalls li { color: var(--warn); }
.pitfalls li span { color: var(--fg); }
.files { list-style: none; padding: 0 !important; }
.files li { display: flex; justify-content: space-between; gap: 10px; font: 12px/1.4 var(--mono); border-bottom: 1px dashed var(--line); padding: 4px 0; }
.files li code { overflow-wrap: anywhere; min-width: 0; }
.files li em { font-style: normal; color: var(--faint); white-space: nowrap; }
.links { list-style: none; padding: 0 !important; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--fg); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.links li { font-size: 14px; }
.links li small { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stats b { display: block; font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }

.view { flex: 1; overflow: auto; padding: 22px 20px 40px; min-width: 0; }
.view h2 { font: 700 22px var(--display); margin: 0 0 6px; }
.view > p { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; min-width: 980px; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
thead th { font: 700 15px var(--display); background: var(--ground-2); position: sticky; top: 0; }
thead th.sel { color: var(--pollen); }
tbody th { font-weight: 600; color: var(--muted); width: 150px; background: var(--ground-2); }
td.sel { background: rgba(232, 195, 106, 0.06); }
td .ld { display: block; }
td .ld b { font: 500 11px var(--mono); color: var(--faint); margin-right: 4px; }
ol.recipe { max-width: 75ch; display: grid; gap: 12px; padding-left: 22px; }
ol.recipe li::marker { font: 700 15px var(--display); color: var(--pollen); }
.rules { max-width: 75ch; display: grid; gap: 8px; padding-left: 18px; color: var(--muted); }

svg text { font-family: var(--body); pointer-events: none; }
@media (max-width: 860px) {
  main { flex-direction: column; }
  .stage { flex: none; height: 62vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); flex: none; }
  .tabs { margin-left: 0; }
  header, .filters { padding-inline: 16px; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="brand"><h1>MC2 Foliage Atlas</h1><span id="subtitle">every piece, every version</span></div>
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" id="tab-map" aria-pressed="true">Constellation</button>
      <button class="tab" id="tab-matrix" aria-pressed="false">Versions</button>
      <button class="tab" id="tab-recipe" aria-pressed="false">Port recipe</button>
    </div>
  </header>
  <div class="filters">
    <div class="fgroup"><label class="cap">Version</label><div class="chips" id="versions"></div></div>
    <div class="fgroup"><label class="cap">Loader</label><div class="chips" id="loaders"></div></div>
    <div class="fgroup"><label class="cap" for="search">Find</label><input id="search" type="search" placeholder="Sodium, setSectionMesh, sway.glsl…" autocomplete="off"></div>
  </div>
  <main id="main-map">
    <div class="stage"><svg id="graph" role="img" aria-label="Constellation of the mod's pieces"></svg><div class="legend" id="legend"></div></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
  <main id="main-matrix" hidden><div class="view" id="matrix"></div></main>
  <main id="main-recipe" hidden><div class="view" id="recipe"></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = /*MAP_DATA*/null;
const state = { version: null, loader: null, query: "", selected: null, hiddenGroups: new Set() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const groupColor = (g) => css("--g-" + g) || css("--fg");
const groups = Object.fromEntries(DATA.groups.map((g) => [g.id, g]));
const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));

function vkey(v) { return v.split(".").map(Number); }
function cmp(a, b) { const x = vkey(a), y = vkey(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }
function holds(bound, v) {
  const m = bound.trim().match(/^(>=|<=|>|<|=)?(\d+(?:\.\d+)*)$/); const c = cmp(v, m[2]);
  return { ">=": c >= 0, "<=": c <= 0, ">": c > 0, "<": c < 0, "=": c === 0 }[m[1] || "="];
}
function applies(n) {
  if (state.version && !(n.versions || []).every((b) => holds(b, state.version))) return false;
  if (state.version && state.loader && !DATA.meta.loadersByVersion[state.version].includes(state.loader)) return false;
  if (state.loader && n.loaders && !n.loaders.includes(state.loader)) return false;
  return true;
}
function matches(n) {
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  const hay = [n.label, n.summary, ...(n.details || []), ...(n.pitfalls || []), ...(n.files || [])].join(" ").toLowerCase();
  return hay.includes(q);
}
function scope(n) {
  const out = [];
  if (n.versions && n.versions.length) out.push(n.versions.join(" "));
  if (n.loaders) out.push(n.loaders.join(" / "));
  return out.length ? out : ["all versions"];
}

/* ---------- filters ---------- */
function chip(label, pressed, onClick) {
  const b = document.createElement("button"); b.className = "chip"; b.textContent = label;
  b.setAttribute("aria-pressed", pressed); b.addEventListener("click", onClick); return b;
}
function renderFilters() {
  const vs = $("versions"); vs.replaceChildren();
  vs.append(chip("All", !state.version, () => { state.version = null; refresh(); }));
  DATA.meta.versions.forEach((v) => vs.append(chip(v, state.version === v, () => { state.version = v; refresh(); })));
  const ls = $("loaders"); ls.replaceChildren();
  ls.append(chip("All", !state.loader, () => { state.loader = null; refresh(); }));
  ["fabric", "neoforge", "forge"].forEach((l) => ls.append(chip(l[0].toUpperCase() + l.slice(1).replace("forge", "Forge"), state.loader === l,
    () => { state.loader = l; refresh(); })));
}
$("search").addEventListener("input", (e) => { state.query = e.target.value.trim(); refresh(); });

/* ---------- constellation ---------- */
const svg = d3.select("#graph");
const root = svg.append("g");
const defs = svg.append("defs");
const glow = defs.append("filter").attr("id", "glow").attr("x", "-100%").attr("y", "-100%").attr("width", "300%").attr("height", "300%");
glow.append("feGaussianBlur").attr("stdDeviation", 3.2).attr("result", "b");
const merge = glow.append("feMerge"); merge.append("feMergeNode").attr("in", "b"); merge.append("feMergeNode").attr("in", "SourceGraphic");

const degree = {}; DATA.edges.forEach((e) => { degree[e.source] = (degree[e.source] || 0) + 1; degree[e.target] = (degree[e.target] || 0) + 1; });
const neighbors = {}; DATA.edges.forEach((e) => { (neighbors[e.source] ||= new Set()).add(e.target); (neighbors[e.target] ||= new Set()).add(e.source); });
const nodes = DATA.nodes.map((n) => ({ ...n, r: n.kind === "version" ? 9 : 4 + Math.sqrt(degree[n.id] || 1) * 2.1 }));
const links = DATA.edges.map((e) => ({ ...e }));
const groupIds = DATA.groups.map((g) => g.id);
let centers = {};
function layoutCenters(w, h) {
  const R = Math.min(w, h) * 0.34;
  groupIds.forEach((g, i) => {
    const a = (i / groupIds.length) * Math.PI * 2 - Math.PI / 2;
    centers[g] = { x: w / 2 + Math.cos(a) * R * (g === "core" ? 0.15 : 1), y: h / 2 + Math.sin(a) * R * (g === "core" ? 0.15 : 0.82) };
  });
}
const linkSel = root.append("g").attr("stroke-linecap", "round").selectAll("line").data(links).join("line")
  .attr("stroke", css("--line")).attr("stroke-width", 1);
const nodeSel = root.append("g").selectAll("g").data(nodes).join("g").attr("class", "node").style("cursor", "pointer")
  .attr("tabindex", 0).attr("role", "button").attr("aria-label", (d) => d.label)
  .on("click", (e, d) => { e.stopPropagation(); select(d.id); })
  .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(d.id); } });
nodeSel.append("circle").attr("class", "halo").attr("r", (d) => d.r + 7).attr("fill", (d) => groupColor(d.group)).attr("opacity", 0.1);
nodeSel.append("circle").attr("class", "core").attr("r", (d) => d.r).attr("fill", (d) => groupColor(d.group)).attr("filter", "url(#glow)")
  .attr("stroke", (d) => d.kind === "version" ? css("--ground") : "none").attr("stroke-width", 2);
nodeSel.append("text").attr("x", (d) => d.r + 5).attr("y", 4).attr("fill", css("--fg"))
  .attr("font-size", (d) => d.kind === "version" ? 14 : 12).attr("font-weight", (d) => d.kind === "version" ? 700 : 500)
  .text((d) => d.label);
nodeSel.append("title").text((d) => d.label + " — " + d.summary);

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => l.source.group === l.target.group ? 38 : 120).strength(0.25))
  .force("charge", d3.forceManyBody().strength(-170))
  .force("collide", d3.forceCollide().radius((d) => d.r + 16))
  .force("x", d3.forceX((d) => centers[d.group]?.x ?? 0).strength(0.16))
  .force("y", d3.forceY((d) => centers[d.group]?.y ?? 0).strength(0.16))
  .on("tick", () => {
    linkSel.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
    nodeSel.attr("transform", (d) => `translate(${d.x},${d.y})`);
  });
nodeSel.call(d3.drag()
  .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
  .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
  .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
const zoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", (e) => root.attr("transform", e.transform));
svg.call(zoom).on("click", () => select(null));

function resize() {
  const el = $("graph"); const w = el.clientWidth || 800, h = el.clientHeight || 600;
  layoutCenters(w, h); sim.force("x").x((d) => centers[d.group].x); sim.force("y").y((d) => centers[d.group].y); sim.alpha(0.6).restart();
}
new ResizeObserver(resize).observe($("graph"));

function paintGraph() {
  const sel = state.selected, near = sel ? neighbors[sel] || new Set() : null;
  const visible = (d) => applies(d) && matches(d) && !state.hiddenGroups.has(d.group);
  nodeSel.attr("opacity", (d) => {
    if (!visible(d)) return 0.08;
    if (sel && d.id !== sel && !near.has(d.id)) return 0.25;
    return 1;
  });
  nodeSel.select("text").attr("opacity", (d) => (sel ? (d.id === sel || near.has(d.id)) : (d.kind === "version" || (degree[d.id] || 0) >= 4 || state.query)) ? 1 : 0.55);
  nodeSel.select(".halo").attr("opacity", (d) => d.id === sel ? 0.35 : 0.1);
  linkSel.attr("stroke", (l) => sel && (l.source.id === sel || l.target.id === sel) ? groupColor(byId[sel].group) : css("--line"))
    .attr("stroke-width", (l) => sel && (l.source.id === sel || l.target.id === sel) ? 1.8 : 1)
    .attr("opacity", (l) => !visible(l.source) || !visible(l.target) ? 0.05 : sel && l.source.id !== sel && l.target.id !== sel ? 0.25 : 0.9);
}

function renderLegend() {
  const lg = $("legend"); lg.replaceChildren();
  DATA.groups.forEach((g) => {
    const b = document.createElement("button"); b.setAttribute("aria-pressed", !state.hiddenGroups.has(g.id)); b.title = g.about;
    b.innerHTML = `<span class="dot" style="background:${groupColor(g.id)};color:${groupColor(g.id)}"></span>${esc(g.label)}`;
    b.addEventListener("click", () => { state.hiddenGroups.has(g.id) ? state.hiddenGroups.delete(g.id) : state.hiddenGroups.add(g.id); renderLegend(); paintGraph(); });
    lg.append(b);
  });
}

/* ---------- panel ---------- */
function select(id) { state.selected = id; paintGraph(); renderPanel(); }
function renderPanel() {
  const p = $("panel");
  if (!state.selected) {
    const shown = DATA.nodes.filter(applies);
    const pit = shown.reduce((s, n) => s + (n.pitfalls || []).length, 0);
    p.innerHTML = `
      <h2>${state.version ? "Minecraft " + esc(state.version) : "All versions"}${state.loader ? " · " + esc(state.loader) : ""}</h2>
      <p class="hint">Pick a star to read what it does, where it lives and what it touches. Drag to move, scroll to zoom, the legend hides a constellation.</p>
      <div class="stats"><div><b>${shown.length}</b><span>pieces</span></div><div><b>${DATA.edges.length}</b><span>links</span></div><div><b>${pit}</b><span>pitfalls</span></div></div>
      <h3>About this map</h3><p>${esc(DATA.meta.about)}</p>
      ${DATA.unmapped.length ? `<h3>Files not on the map</h3><ul class="files">${DATA.unmapped.map((f) => `<li><code>${esc(f)}</code></li>`).join("")}</ul>` : ""}
      <h3>Constellations</h3><ul>${DATA.groups.map((g) => `<li><b style="color:${groupColor(g.id)}">${esc(g.label)}</b>: ${esc(g.about)}</li>`).join("")}</ul>`;
    return;
  }
  const n = byId[state.selected], g = groups[n.group];
  const out = DATA.edges.filter((e) => e.source === n.id).map((e) => ({ id: e.target, label: e.label }));
  const inn = DATA.edges.filter((e) => e.target === n.id).map((e) => ({ id: e.source, label: e.label, back: true }));
  const fi = n.fileInfo || {};
  p.innerHTML = `
    <h2>${esc(n.label)}</h2>
    <div class="meta"><span class="tag group" style="background:${groupColor(n.group)}">${esc(g.label)}</span>${scope(n).map((s) => `<span class="tag">${esc(s)}</span>`).join("")}
      ${applies(n) ? "" : `<span class="tag" style="color:var(--warn)">not in this version</span>`}</div>
    <p>${esc(n.summary)}</p>
    ${(n.details || []).length ? `<h3>How it works</h3><ul>${n.details.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
    ${(n.pitfalls || []).length ? `<h3>Pitfalls</h3><ul class="pitfalls">${n.pitfalls.map((d) => `<li><span>${esc(d)}</span></li>`).join("")}</ul>` : ""}
    ${(n.files || []).length ? `<h3>Files</h3><ul class="files">${n.files.map((f) => `<li><code>${esc(f)}</code><em>${fi[f] ? fi[f].lines + " lines" + (fi[f].guard ? " · " + esc(fi[f].guard.replace("//? ", "").replace(" {", "")) : "") : ""}</em></li>`).join("")}</ul>` : ""}
    ${out.length || inn.length ? `<h3>Connections</h3><ul class="links">${[...out, ...inn].map((l) =>
      `<li><small>${l.back ? "← " : ""}${esc(l.label)}${l.back ? "" : " →"}</small> <button class="link" data-id="${esc(l.id)}">${esc(byId[l.id].label)}</button></li>`).join("")}</ul>` : ""}`;
  p.querySelectorAll(".link").forEach((b) => b.addEventListener("click", () => select(b.dataset.id)));
}

/* ---------- versions & recipe ---------- */
function renderMatrix() {
  const vs = DATA.meta.versions;
  const cell = (text) => {
    if (!text) return `<span style="color:var(--faint)">—</span>`;
    const parts = text.split(" | ");
    return parts.map((part) => {
      const m = part.match(/^(fabric|neoforge|forge|both): (.*)$/);
      if (m && state.loader && m[1] !== state.loader && m[1] !== "both") return "";
      return m ? `<span class="ld"><b>${m[1]}</b>${esc(m[2])}</span>` : `<span class="ld">${esc(part)}</span>`;
    }).join("");
  };
  $("matrix").innerHTML = `<h2>Versions at a glance</h2><p>${esc(DATA.matrix.about)} Pick a version above to highlight its column, a loader to keep only its lines.</p>
    <div class="matrix-wrap"><table><thead><tr><th></th>${vs.map((v) => `<th class="${v === state.version ? "sel" : ""}">${v}</th>`).join("")}</tr></thead>
    <tbody>${DATA.matrix.rows.map((r) => `<tr><th scope="row">${esc(r.label)}</th>${vs.map((v) => `<td class="${v === state.version ? "sel" : ""}">${cell(r.cells[v])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function renderRecipe() {
  $("recipe").innerHTML = `<h2>Porting to a new version</h2><p>The order the 26.3 port followed, one step and one test at a time.</p>
    <ol class="recipe">${DATA.portRecipe.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    <h2 style="margin-top:34px">Working rules</h2><ul class="rules">${DATA.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`;
}

const views = { map: "main-map", matrix: "main-matrix", recipe: "main-recipe" };
function show(view) {
  Object.entries(views).forEach(([k, id]) => { $(id).hidden = k !== view; $("tab-" + k).setAttribute("aria-pressed", k === view); });
  try { localStorage.setItem("atlas-view", view); } catch (e) {}
  if (view === "map") resize();
}
Object.keys(views).forEach((k) => $("tab-" + k).addEventListener("click", () => show(k)));

function refresh() { renderFilters(); paintGraph(); renderPanel(); renderMatrix(); }
renderLegend(); refresh(); layoutCenters($("graph").clientWidth || 800, $("graph").clientHeight || 600);
let start = "map"; try { start = localStorage.getItem("atlas-view") || "map"; } catch (e) {}
if (["matrix", "recipe"].includes(location.hash.slice(1))) start = location.hash.slice(1);
renderRecipe(); show(start);
</script>
